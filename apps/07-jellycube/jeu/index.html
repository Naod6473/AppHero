}

/* =====================================================================
   11. Dessin
   ===================================================================== */
function rectArrondi(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function dessinerArene() {
  ctx.drawImage(decorFond, 0, 0, W, H);
  // poussières lumineuses qui flottent
  for (const m of motes) { ctx.fillStyle = `rgba(255,170,120,${m.a})`; ctx.fillRect(m.x, m.y, m.t, m.t); }
  // halo sous la plateforme
  let gr = ctx.createRadialGradient(640, PF.y + 10, 10, 640, PF.y + 10, 420);
  gr.addColorStop(0, "rgba(255,140,80,0.12)"); gr.addColorStop(1, "rgba(255,140,80,0)");
  ctx.fillStyle = gr; ctx.fillRect(PF.x - 300, PF.y - 200, PF.w + 600, 500);
  for (const P of PLATS) {
    // ombre portée, puis la plateforme (on découpe la texture à la bonne largeur)
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(P.x + 10, P.y + P.h, P.w - 20, 14);
    ctx.drawImage(decorPlateforme, 0, 0, Math.min(P.w, 560) * echelle, P.h * echelle, P.x, P.y, P.w, P.h);
    // bord supérieur lumineux
    ctx.save();
    ctx.shadowColor = "#ff9a4a"; ctx.shadowBlur = 18;
    ctx.strokeStyle = "#ffd7aa"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(P.x, P.y + 1); ctx.lineTo(P.x + P.w, P.y + 1); ctx.stroke();
    ctx.restore();
    gr = ctx.createLinearGradient(0, P.y - 40, 0, P.y);
    gr.addColorStop(0, "rgba(255,190,130,0)"); gr.addColorStop(1, "rgba(255,190,130,0.08)");
    ctx.fillStyle = gr; ctx.fillRect(P.x, P.y - 40, P.w, 40);
  }
}

function dessinerAncres() {
  ctx.save();
  // l'ancrage visé par un joueur en l'air est mis en évidence
  const vises = new Map();
  for (const c of cubes) {
    if (c.horsJeu || c.sol || c.etat === "corde" || c.cordeCd > 0 || c.ia || ecran === "replay") continue;
    const a = ancreProche(c); if (a) vises.set(a, c.couleur);
  }
  ANCRES.forEach((a, i) => {
    const s = 14 + Math.sin(tempsTotal * 3 + i) * 1.2;
    ctx.shadowColor = "#fff"; ctx.shadowBlur = 8;
    ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 2;
    ctx.strokeRect(a.x - s / 2, a.y - s / 2, s, s);
    if (vises.has(a)) {
      const p = 24 + Math.sin(tempsTotal * 12) * 3;
      ctx.shadowColor = vises.get(a); ctx.strokeStyle = vises.get(a); ctx.globalAlpha = 0.8;
      ctx.strokeRect(a.x - p / 2, a.y - p / 2, p, p); ctx.globalAlpha = 1;

}

function dessinerCorde(c) {
  if (c.etat !== "corde" || c.horsJeu) return;
  const a = c.corde.a, t = c.corde.anim;
  const ex = lerp(c.x, a.x, t), ey = lerp(c.y, a.y, t);
  ctx.save();
  ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 8;
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.fillRect(ex - 3, ey - 3, 6, 6);
  ctx.restore();
}

// Corps du cube : contour néon, intérieur sombre, yeux LED
function corpsCube(c, x, y, angle, sq, plein, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(1 / sq, sq);                   // la déformation reste dans l'axe du monde (effet gelée)
  let penche = 0;
  if (c.sol && c.etat !== "dash") penche = clamp(c.vx * 0.0005, -0.18, 0.18);
  ctx.rotate(angle + penche);
  const blanc = c.flashT > 0 && effetsOn(EFFET_FLASH);
  if (plein) {
    ctx.shadowColor = blanc ? "#fff" : c.couleur; ctx.shadowBlur = 22;
    rectArrondi(ctx, -DEMI, -DEMI, TAILLE_CUBE, TAILLE_CUBE, 6);
    ctx.fillStyle = blanc ? "#ffffff" : "#0c0d12"; ctx.fill();
    ctx.lineWidth = c.perso && c.perso.forme === "lourd" ? 6 : 4; ctx.strokeStyle = blanc ? "#ffffff" : c.couleur; ctx.stroke();
    ctx.shadowBlur = 0;
    if (!blanc) {
      // reflet intérieur discret
      const gr = ctx.createLinearGradient(0, -DEMI, 0, DEMI);
      gr.addColorStop(0, "rgba(255,255,255,0.06)"); gr.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gr; rectArrondi(ctx, -DEMI + 4, -DEMI + 4, TAILLE_CUBE - 8, TAILLE_CUBE - 8, 3); ctx.fill();
      // yeux : deux petites LED verticales
      const regard = c.dir * 6, hY = c.clignT < 0 ? 2 : (c.etourdi > 0 ? 4 : 12);
      ctx.fillStyle = c.couleur; ctx.shadowColor = c.couleur; ctx.shadowBlur = 8;
      ctx.fillRect(regard - 9, -6 - hY / 2 + 2, 5, hY);
      ctx.fillRect(regard + 4, -6 - hY / 2 + 2, 5, hY);
      ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.shadowBlur = 0;
      ctx.fillRect(regard - 8, -6 - hY / 2 + 3, 2, Math.max(1, hY - 6));
      ctx.fillRect(regard + 5, -6 - hY / 2 + 3, 2, Math.max(1, hY - 6));
      // signe distinctif du personnage
      ctx.strokeStyle = c.couleur; ctx.fillStyle = c.couleur; ctx.lineCap = "round";
      const f = c.perso ? c.perso.forme : "";
      if (f === "lourd") {            // gros sourcils froncés
        ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(regard - 11, -17); ctx.lineTo(regard - 3, -13); ctx.moveTo(regard + 12, -17); ctx.lineTo(regard + 4, -13); ctx.stroke();
      } else if (f === "vif") {       // trois traits de vitesse
        ctx.lineWidth = 2; ctx.beginPath();
        for (let k = 0; k < 3; k++) { ctx.moveTo(-DEMI + 7 + k * 7, DEMI - 7); ctx.lineTo(-DEMI + 12 + k * 7, DEMI - 15); }
        ctx.stroke();
      } else if (f === "acro") {      // antenne
        ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(2, -DEMI); ctx.lineTo(7, -DEMI - 11); ctx.stroke();
        ctx.beginPath(); ctx.arc(8, -DEMI - 14, 3.5, 0, Math.PI * 2); ctx.fill();
      } else if (f === "pendu") {     // anneau d'accroche
        ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, -DEMI - 8, 6, 0, Math.PI * 2); ctx.stroke();
      }
    }
  } else {
    rectArrondi(ctx, -DEMI, -DEMI, TAILLE_CUBE, TAILLE_CUBE, 6);
    ctx.lineWidth = 3; ctx.strokeStyle = c.couleur; ctx.stroke();
  }
  ctx.restore();
}

function dessinerCube(c) {
  if (c.horsJeu) return;
  // images fantômes
  for (const t of c.trainee) corpsCube(c, t.x, t.y, t.a, t.sq, false, 0.45 * (1 - t.vie / 0.2));
  const sansDash = physique === PHYS_AVENTURE && !c.dashAir, coul = c.couleur;
  if (sansDash) c.couleur = "#6f8294";           // aventure : le cube pâlit quand le dash est utilisé
  corpsCube(c, c.x, c.y, c.angle, c.sq, true, 1);
  c.couleur = coul;
  // losange du contre
  if (c.contreT > 0 || c.contreReussi > 0) {
    const ok = c.contreReussi > 0;
    const k = ok ? 1 + (0.35 - c.contreReussi) * 4 : 1 + (1 - c.contreT / CONTRE_FENETRE) * 0.15;
    const r = 44 * k;
    ctx.save();
    ctx.globalAlpha = ok ? c.contreReussi / 0.35 : 1;
    ctx.translate(c.x, c.y); ctx.rotate(Math.PI / 4);
    ctx.shadowColor = "#fff"; ctx.shadowBlur = 16; ctx.strokeStyle = "#fff"; ctx.lineWidth = ok ? 5 : 3;
    ctx.strokeRect(-r / Math.SQRT2, -r / Math.SQRT2, (2 * r) / Math.SQRT2, (2 * r) / Math.SQRT2);
    ctx.restore();
  }
}

// Ligne de petits triangles creux qui montre la trajectoire du dash
function dessinerVisee(c) {
  if (c.etat !== "visee" || c.horsJeu) return;
  const d = c.viseeDir, charge = clamp(c.viseeT / DASH_VISEE_MAX, 0, 1);
  const n = 4 + Math.round(charge * 6);
  const ang = Math.atan2(d.y, d.x);
  ctx.save();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.shadowColor = c.couleur; ctx.shadowBlur = 10;
  for (let i = 0; i < n; i++) {
    const dist = 42 + i * 26 + ((tempsTotal * 60) % 26) * 0.3;
    const x = c.x + d.x * dist, y = c.y + d.y * dist, s = 8 - i * 0.35;
    ctx.globalAlpha = 1 - i / (n + 2);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, -s * 0.8); ctx.lineTo(-s * 0.7, s * 0.8); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// Petite flèche « v » et nom au-dessus du cube (ou flèche au bord si le cube sort par le haut)
function dessinerEtiquette(c) {
  if (c.horsJeu) return;
  const y = c.y - DEMI * c.sq - 18;
  ctx.save();
  ctx.fillStyle = c.couleur; ctx.strokeStyle = c.couleur; ctx.lineWidth = 2.5;
  ctx.font = "800 15px system-ui, Segoe UI, Arial, sans-serif"; ctx.textAlign = "center";
  if (c.y < -DEMI) {

    ctx.fillText(c.nom, x, 40);
  } else {
    ctx.fillText(c.nom, c.x, y - 14);
    ctx.beginPath(); ctx.moveTo(c.x - 6, y - 6); ctx.lineTo(c.x, y); ctx.lineTo(c.x + 6, y - 6); ctx.stroke();
  }
  ctx.restore();
}

function dessinerParticules() {
  for (const p of particules) {
    ctx.save(); ctx.globalAlpha = 1 - p.vie / p.max; ctx.fillStyle = p.c;
    ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillRect(-p.t / 2, -p.t / 2, p.t, p.t); ctx.restore();
  }
  for (const f of flashs) {
    const k = f.vie / f.max;
    ctx.save(); ctx.globalAlpha = 1 - k; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.4 + k * 0.8), 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}

function texteContour(txt, x, y, taille, couleur, lueur) {
  ctx.font = `900 ${taille}px system-ui, Segoe UI, Arial Black, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = taille * 0.14; ctx.strokeStyle = "#120605"; ctx.strokeText(txt, x, y);
  ctx.shadowColor = lueur || couleur; ctx.shadowBlur = 24; ctx.fillStyle = couleur; ctx.fillText(txt, x, y);
  ctx.shadowBlur = 0;
}

function dessinerTextes() {
  for (const t of textes) {
    const k = t.vie / t.max;
    const pop = t.vie < 0.14 ? 0.4 + (t.vie / 0.14) * 0.85 : 1.25 - Math.min(0.25, (t.vie - 0.14) * 1.2);
    ctx.save();
    ctx.globalAlpha = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
    ctx.translate(t.x, t.y - t.vie * 30); ctx.rotate(t.rot); ctx.scale(pop, pop);
    texteContour(t.txt, 0, 0, t.taille, "#ffffff", t.c);
    ctx.restore();
  }
}

function dessinerHUD() {

function dessinerBanniere(dt) {
  if (!banniere) return;
  banniere.vie += dt;
  if (banniere.vie > banniere.max) { banniere = null; return; }
  const b = banniere, k = b.vie;
  const pop = k < 0.12 ? 0.5 + (k / 0.12) * 0.6 : 1.1 - Math.min(0.1, (k - 0.12) * 0.6);
  const sortie = b.max - k < 0.2 ? (b.max - k) / 0.2 : 1;
  ctx.save();
  ctx.globalAlpha = sortie;
  ctx.translate(640, 250); ctx.scale(pop, pop);
  texteContour(b.txt, 0, 0, 68, "#ffffff", b.c);
  if (b.sous) {
    ctx.font = "700 22px system-ui, sans-serif"; ctx.fillStyle = "rgba(255,240,230,0.85)"; ctx.textAlign = "center";
    ctx.fillText(b.sous, 0, 58);
  }
  ctx.restore();
}

function touche(x, y, label, l = 34) {

}

function dessinerTitre() {

// --- Ralenti : on rejoue l'extrait enregistré, zoomé sur le cube éjecté ---
function fantome(k, d, i) {
  const c = cubes[k];
  const o = Object.assign(Object.create(Cube.prototype), { couleur: c.couleur, perso: c.perso, nom: c.nom, num: c.num }, d);
  o.clignT = 1; o.trainee = [];
  o.corde = d.ax == null ? null : { a: { x: d.ax, y: d.ay }, anim: 1 };
  for (let j = 6; j >= 1; j--) {
    const f = replay.frames[i - j * 2]; if (!f) continue;
    const q = f.cubes[k];
    if (!q.horsJeu && Math.hypot(q.vx, q.vy) > 700) o.trainee.push({ x: q.x, y: q.y, a: q.angle, sq: q.sq, vie: j * 0.03 });
  }
  return o;
}
function dessinerReplay() {
  const i = Math.min(replay.frames.length - 1, Math.floor(replay.i)), f = replay.frames[i];
  // remettre le décor tel qu'il était à ce moment-là
  const pl = PLATS.map((p) => [p.x, p.w]), an = ANCRES.map((a) => [a.x, a.y]);
  f.plats.forEach((v, k) => { if (PLATS[k]) { PLATS[k].x = v[0]; PLATS[k].w = v[1]; } });
  f.ancres.forEach((v, k) => { if (ANCRES[k]) { ANCRES[k].x = v[0]; ANCRES[k].y = v[1]; } });
  const cc = f.cubes[replay.cible], z = REPLAY_ZOOM;
  const fx = clamp(cc.x, W / (2 * z), W - W / (2 * z)), fy = clamp(cc.y, H / (2 * z), H - H / (2 * z));
  replay.cx = replay.cx == null ? fx : lerp(replay.cx, fx, 0.1);
  replay.cy = replay.cy == null ? fy : lerp(replay.cy, fy, 0.1);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-replay.cx, -replay.cy);
  dessinerArene(); dessinerAncres();
  const fantomes = f.cubes.map((d, k) => fantome(k, d, i));
  fantomes.forEach(dessinerCorde); fantomes.forEach(dessinerVisee); fantomes.forEach(dessinerCube); fantomes.forEach(dessinerEtiquette);
  ctx.restore();
  pl.forEach((v, k) => { PLATS[k].x = v[0]; PLATS[k].w = v[1]; });
  an.forEach((v, k) => { ANCRES[k].x = v[0]; ANCRES[k].y = v[1]; });
  // bandes noires « cinéma »
  ctx.save();
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 58); ctx.fillRect(0, H - 58, W, 58);
  if (Math.floor(tempsTotal * 2) % 2 === 0) { ctx.fillStyle = "#ff3b2a"; ctx.beginPath(); ctx.arc(42, 29, 8, 0, Math.PI * 2); ctx.fill(); }
  ctx.font = "900 22px system-ui, sans-serif"; ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("REPLAY", 60, 30);

/* =====================================================================
   12. Boucle principale : simulation à pas fixe (120 Hz), dessin à chaque image
   ===================================================================== */
const PAS = 1 / 120;
let dernier = performance.now(), accu = 0;
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - dernier) / 1000);
  dernier = maintenant; tempsTotal += dt;
  lireManette();
  if (portrait()) { if (["depart", "jeu", "point", "tuto", "finManche", "aventure"].includes(ecran)) { ecranAvantPause = ecran; ecran = "pause"; } dessinerPortrait(); requestAnimationFrame(boucle); return; }
  majEffetsTempsReel(dt);
  if (ecran === "replay") {
    replay.i += dt * 120 * REPLAY_VITESSE;
    if (replay.i >= replay.frames.length - 1) finReplay();
  } else if (ecran !== "pause") {
    if (hitstop > 0) hitstop -= dt;          // gel : on ne simule pas, on dessine seulement
    else {
      accu += dt * ralenti;
      while (accu >= PAS) {
        pasSimulation(PAS); accu -= PAS;
        if (hitstop > 0) { accu = 0; break; }
      }
    }
  }
  dessiner(ecran === "pause" ? 0 : dt);
