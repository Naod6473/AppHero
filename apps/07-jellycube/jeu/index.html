/* =====================================================================
   JELLYCUBE : aventure à défilement + combat « sumo » en cubes
   Un seul fichier, HTML5 Canvas + JavaScript, aucune dépendance.

     1. RÉGLAGES        toutes les valeurs à ajuster sont ici
     2. Outils          petites fonctions utiles
     3. Écran           taille du canvas, décor précalculé
     4. Sons            sons synthétisés (Web Audio API)
     5. Clavier/souris
     6. Effets          particules, textes, tremblement, hitstop
     7. Cube            le personnage et sa physique
     8. Combats         collisions entre cubes, coups, contres
     9. IA              l'adversaire du mode solo
    10. Partie          manches, points, chrono, écrans
    11. Dessin
    12. Boucle principale
   ===================================================================== */

   1. RÉGLAGES
   ===================================================================== */

const AV_GRAVITE = 2600, AV_SAUT = 940, AV_DOUBLE_SAUT = 800, AV_VITESSE_MAX = 450;
const AV_CHUTE = 1.6, AV_CHUTE_MAX = 1200;      // on retombe plus vite qu'on ne monte

const MUR_SAUT_X = 520, MUR_SAUT_Y = 880;   // rebond contre un mur (aussi en combat)
const MUR_VERROU = 0.14;                // après un rebond, la direction est ignorée un court instant (s)
const COYOTE = 0.10;                    // on peut encore sauter juste après avoir quitté le bord (s)
const APRES_DASH = 0.15;                // juste après un dash, on éclate encore les ennemis touchés (s)

const ENNEMI_VUE = 380;                 // distance à laquelle un chasseur te repère (px)
// En aventure, un seul dash par saut : il revient au sol, sur un cristal, à la corde ou en éclatant un ennemi

const CRISTAL_RETOUR = 2.5;             // un cristal réapparaît après (s)

const MOBILE_VITESSE = 120;             // plateformes mobiles (px/s en moyenne)
const SCIE_VITESSE = 160, SCIE_RAYON = 22;
const TOURELLE_CADENCE = 2.2, TOURELLE_PORTEE = 760;
const ORBE_VITESSE = 300, ORBE_RAYON = 11, ORBE_RENVOI = 1.9;   // boules des tourelles (renvoyées au CONTRE)
const LAVE_MARGE = 320;                 // la lave repart à cette distance sous le point de passage (px)
const MUR_LUMIERE_RECUL = 450;          // le mur de lumière repart à cette distance derrière toi (px)
const NOIR_RAYON = 250;                 // niveau sombre : rayon de lumière autour du cube (px)
const BOSS_VIES = 3, BOSS_DEMI = 46;    // le gros rouge : 3 éjections, cube de 92 px
const BOSS_CHARGE = 720, BOSS_RECUL = 600, BOSS_GLISSE = 2.6, BOSS_ONDE = 320;
const MONTAGE_VITESSE = 1.5, MONTAGE_DUREE_MAX = 12;   // montage des essais à la fin d'un niveau

// --- IA : trois niveaux ---
//   reaction : temps entre deux décisions (s) · agressivite : chance d'attaquer à chaque décision
//   contre : chance de tenter un contre · corde : chance de bien se rattraper à la corde
//   imprecision : erreur de visée du dash (radians) · portee : distance d'attaque (px)
const NIVEAUX_IA = [
  { nom: "Facile",  reaction: 0.34, agressivite: 0.3,  contre: 0.08, corde: 0.55, imprecision: 0.35, portee: 240 },
  { nom: "Normal",  reaction: 0.2,  agressivite: 0.55, contre: 0.3,  corde: 0.9,  imprecision: 0.12, portee: 300 },
  { nom: "Costaud", reaction: 0.12, agressivite: 0.75, contre: 0.5,  corde: 1,    imprecision: 0.03, portee: 330 },
];

// --- Personnages : multiplicateurs appliqués aux réglages ci-dessus ---
const PERSOS = [
  { forme: "lourd", nom: "LE LOURD",    desc: ["Recule moins fort,", "mais il est plus lent"],
    vitesse: 0.88, saut: 0.96, sauts: 2, recul: 0.68, portee: 1,    cordeCd: 1,   dashCd: 1.1 },
  { forme: "vif",   nom: "LE VIF",      desc: ["Rapide, dash vite prêt,", "mais il vole plus loin"],
    vitesse: 1.25, saut: 1,    sauts: 2, recul: 1.15, portee: 1,    cordeCd: 1,   dashCd: 0.75 },
  { forme: "acro",  nom: "L'ACROBATE",  desc: ["Triple saut", "en l'air"],
    vitesse: 1,    saut: 1.03, sauts: 3, recul: 1.05, portee: 1,    cordeCd: 1,   dashCd: 1 },
  { forme: "pendu", nom: "LE PENDU",    desc: ["Corde plus longue", "et plus vite prête"],
    vitesse: 1,    saut: 1,    sauts: 2, recul: 1,    portee: 1.35, cordeCd: 0.5, dashCd: 1 },
];

// --- Arènes : plateformes, ancrages de corde, positions de départ ---
const ANCRES_RING = [{ x: 150, y: 290 }, { x: 1130, y: 290 }, { x: 640, y: 175 }, { x: 250, y: 615 }, { x: 1030, y: 615 }];
const ARENES = [
  { nom: "LE RING", desc: "La plateforme classique",
    plateformes: [{ x: 360, y: 470, w: 560, h: 64 }], ancres: ANCRES_RING, depart: [490, 790] },
  { nom: "PEAU DE CHAGRIN", desc: "La plateforme rétrécit pendant la manche", retrecit: 220,
    plateformes: [{ x: 360, y: 470, w: 560, h: 64 }], ancres: ANCRES_RING, depart: [490, 790] },
  { nom: "DEUX ÎLES", desc: "Un vide au milieu : saute ou prends la corde",
    plateformes: [{ x: 290, y: 470, w: 290, h: 64 }, { x: 700, y: 470, w: 290, h: 64 }],
    ancres: [{ x: 140, y: 290 }, { x: 1140, y: 290 }, { x: 640, y: 240 }, { x: 640, y: 610 }, { x: 225, y: 640 }, { x: 1055, y: 640 }],
    depart: [435, 845] },
  { nom: "ANCRES FOLLES", desc: "Les points d'accroche tournent",
    plateformes: [{ x: 380, y: 470, w: 520, h: 64 }],
    ancres: [{ x: 170, y: 300, orbite: 70, v: 1.1 }, { x: 1110, y: 300, orbite: 70, v: -1.1 },
             { x: 640, y: 170, orbite: 120, v: 0.7, horiz: true },
             { x: 250, y: 610, orbite: 50, v: 1.6 }, { x: 1030, y: 610, orbite: 50, v: -1.6 }],
    depart: [510, 770] },
];
const BLEU = "#3fb6ff", ORANGE = "#ff8a2a";
// Physique en cours : celle du combat ou celle de l'aventure
const PHYS_ARENE = { gravite: GRAVITE, saut: SAUT, double: DOUBLE_SAUT, vmax: VITESSE_MAX, chute: GRAVITE_CHUTE, chuteMax: VITESSE_MAX_CHUTE, accelSol: ACCEL_SOL, accelAir: ACCEL_AIR, coupe: SAUT_COUPE };
const PHYS_AVENTURE = { gravite: AV_GRAVITE, saut: AV_SAUT, double: AV_DOUBLE_SAUT, vmax: AV_VITESSE_MAX, chute: AV_CHUTE, chuteMax: AV_CHUTE_MAX, accelSol: AV_ACCEL_SOL, accelAir: AV_ACCEL_AIR, coupe: AV_SAUT_COUPE };
let physique = PHYS_ARENE;

/* =====================================================================
   2. Outils
   ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const signe = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
// Générateur pseudo-aléatoire à graine (décor identique à chaque chargement)
function graine(s) { return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; }

/* =====================================================================
   3. Écran : taille du canvas et décor précalculé
   ===================================================================== */
const canvas = document.getElementById("jeu");
const ctx = canvas.getContext("2d");
let echelle = 1;              // pixels réels par pixel logique
let decorFond = null, decorPlateforme = null;

function redimensionner() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, tactile && tactile.actif ? 1.5 : 2);
  echelle = s * dpr;
  canvas.style.width = Math.floor(W * s) + "px";
  canvas.style.height = Math.floor(H * s) + "px";
  canvas.width = Math.round(W * echelle);
  canvas.height = Math.round(H * echelle);
  construireDecor();
}

function nouveauCalque(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * echelle));
  c.height = Math.max(1, Math.round(h * echelle));
  const g = c.getContext("2d");
  g.setTransform(echelle, 0, 0, echelle, 0, 0);
  return [c, g];
}

function construireDecor() {
  const r = graine(7);
  // --- Fond : dégradé rouge-brun, halo, formes abstraites, vignette, grain ---
  const [f, g] = nouveauCalque(W, H);
  let gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, "#2b0e09"); gr.addColorStop(0.55, "#1c0806"); gr.addColorStop(1, "#0d0403");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  gr = g.createRadialGradient(640, 300, 20, 640, 300, 620);
  gr.addColorStop(0, "rgba(255,130,70,0.22)"); gr.addColorStop(0.4, "rgba(200,70,40,0.10)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // grandes bandes diagonales très discrètes
  g.save(); g.globalAlpha = 0.05; g.fillStyle = "#ffb08a";
  for (let i = 0; i < 6; i++) {
    g.save(); g.translate(r() * W, r() * H); g.rotate(-0.5 + r() * 0.2);
    g.fillRect(-900, -r() * 30, 1800, 20 + r() * 70); g.restore();
  }
  g.restore();
  // losanges abstraits
  g.save(); g.strokeStyle = "rgba(255,160,120,0.06)"; g.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const x = r() * W, y = r() * H * 0.8, s = 30 + r() * 120;
    g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.strokeRect(-s / 2, -s / 2, s, s); g.restore();
  }
  g.restore();
  gr = g.createRadialGradient(640, 360, 300, 640, 360, 900);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,0.65)");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = r() < 0.5 ? "rgba(255,255,255,0.025)" : "rgba(0,0,0,0.08)";
    g.fillRect(r() * W, r() * H, 1.5, 1.5);
  }
  decorFond = f;

  // --- Plateforme : pierre / métal usé ---
  const [p, q] = nouveauCalque(PF.w, PF.h);
  gr = q.createLinearGradient(0, 0, 0, PF.h);
  gr.addColorStop(0, "#5b4c45"); gr.addColorStop(0.15, "#463a35"); gr.addColorStop(1, "#211a17");
  q.fillStyle = gr; q.fillRect(0, 0, PF.w, PF.h);
  for (let i = 0; i < 900; i++) {                      // grain de pierre
    const a = r() * 0.12;
    q.fillStyle = r() < 0.5 ? `rgba(255,230,210,${a})` : `rgba(0,0,0,${a * 1.6})`;
    q.fillRect(r() * PF.w, r() * PF.h, 1 + r() * 3, 1 + r() * 2);
  }
  q.strokeStyle = "rgba(0,0,0,0.35)"; q.lineWidth = 1;   // rayures et fissures
  for (let i = 0; i < 26; i++) {
    let x = r() * PF.w, y = 6 + r() * (PF.h - 10);
    q.beginPath(); q.moveTo(x, y);
    for (let k = 0; k < 3; k++) { x += rand(-40, 40) * r(); y += rand(-6, 6) * r(); q.lineTo(x, y); }
    q.stroke();
  }
  q.fillStyle = "rgba(0,0,0,0.35)";                        // joints de plaques
  for (let x = 70; x < PF.w; x += 140) q.fillRect(x, 4, 2, PF.h - 4);
  for (let x = 20; x < PF.w; x += 140) {                   // rivets
    for (const y of [16, PF.h - 14]) {
      q.fillStyle = "rgba(0,0,0,0.5)"; q.beginPath(); q.arc(x + 1, y + 1, 3, 0, 7); q.fill();
      q.fillStyle = "rgba(210,190,170,0.35)"; q.beginPath(); q.arc(x, y, 3, 0, 7); q.fill();
    }
  }
  q.fillStyle = "rgba(255,220,180,0.10)"; q.fillRect(0, 0, PF.w, 3);
  q.fillStyle = "rgba(0,0,0,0.4)"; q.fillRect(0, PF.h - 4, PF.w, 4);
  decorPlateforme = p;
}

/* =====================================================================
   4. Sons synthétisés (Web Audio API) — pas de fichier audio
   ===================================================================== */
const Son = {
  ac: null, sortie: null, bruit: null,
  init() {
    if (!EFFETS || !EFFET_SONS) return;
    if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    const comp = this.ac.createDynamicsCompressor();
    comp.connect(this.ac.destination);
    this.sortie = this.ac.createGain(); this.sortie.gain.value = VOLUME; this.sortie.connect(comp);
    const n = this.ac.sampleRate, buf = this.ac.createBuffer(1, n, n), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.bruit = buf;
  },
  pret() { return this.ac && this.ac.state === "running"; },
  enveloppe(dur, vol, t0) {
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    g.connect(this.sortie);
    return g;
  },
  osc(type, f0, f1, dur, vol, delai = 0) {
    const t0 = this.ac.currentTime + delai, o = this.ac.createOscillator();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    o.connect(this.enveloppe(dur, vol, t0)); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  souffle(type, f0, f1, dur, vol, q = 1) {
    const t0 = this.ac.currentTime, s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter();
    s.buffer = this.bruit; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    s.connect(f).connect(this.enveloppe(dur, vol, t0));
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  },
  // « boum » grave à l'impact (p = puissance de 0 à 1)
  boum(p) {
    if (!this.pret()) return;
    this.osc("sine", 160, 36, 0.3 + 0.25 * p, 0.6 + 0.4 * p);
    this.osc("triangle", 95, 30, 0.22, 0.35 * p);
    this.souffle("lowpass", 1400, 120, 0.18 + 0.1 * p, 0.5 * p + 0.15);
  },
  // « zip » de la corde
  zip() {
    if (!this.pret()) return;
    this.osc("sawtooth", 380, 2600, 0.09, 0.09);
    this.souffle("highpass", 2500, 7000, 0.11, 0.18);
  },
  // « cling » métallique du contre
  cling() {
    if (!this.pret()) return;
    [1568, 2350, 3140, 4700].forEach((f, i) => this.osc("sine", f, f * 0.995, 0.75 - i * 0.12, 0.22 / (i + 1)));
    this.osc("square", 2100, 1700, 0.04, 0.05);
    this.souffle("highpass", 5000, 9000, 0.05, 0.3);
  },
  saut(n) { if (this.pret()) this.osc("square", 240 + n * 90, 480 + n * 160, 0.08, 0.035); },
  dash(p) { if (!this.pret()) return; this.souffle("bandpass", 450, 2800, 0.2, 0.25 + 0.2 * p, 1.6); this.osc("sawtooth", 110, 55, 0.14, 0.05); },
  armeContre() { if (this.pret()) this.osc("triangle", 1300, 1800, 0.05, 0.04); },
  ejection() { if (!this.pret()) return; this.boum(1); this.souffle("lowpass", 3500, 90, 0.7, 0.45); this.osc("sawtooth", 300, 40, 0.5, 0.06); },
  bip(aigu) { if (this.pret()) this.osc("square", aigu ? 1320 : 660, null, 0.12, 0.06); },
  fanfare() { if (this.pret()) [523, 659, 784, 1047].forEach((f, i) => this.osc("square", f, null, 0.2, 0.06, i * 0.11)); },
};

/* =====================================================================
   5. Clavier et souris
   - On lit la position physique des touches (e.code) : Q/D/Z/S/A/E en AZERTY
     correspondent à KeyA/KeyD/KeyW/KeyS/KeyQ/KeyE. Ça marche donc aussi en QWERTY
     (les mêmes touches, au même endroit).
   ===================================================================== */
const touches = new Set();     // touches tenues
const appuis = new Set();      // touches enfoncées depuis le dernier pas de simulation
const souris = { x: W / 2, y: H / 2, t: -1e9 };

const CONTROLES_J1 = {
  g: ["KeyA"], d: ["KeyD"], h: ["KeyW"], b: [],
  saut: ["KeyW"], dash: ["KeyS"], corde: ["KeyE"], contre: ["KeyQ"], sprint: ["ShiftLeft"],
};
const CONTROLES_J2 = {
  g: ["ArrowLeft"], d: ["ArrowRight"], h: ["ArrowUp"], b: ["ArrowDown"],
  saut: ["ArrowUp"], dash: ["Numpad1"], corde: ["Numpad2"], contre: ["Numpad3"], sprint: ["Numpad0"],
};
// En solo, le joueur peut aussi utiliser les touches du J2
const CONTROLES_SOLO = {};
for (const k in CONTROLES_J1) CONTROLES_SOLO[k] = [...CONTROLES_J1[k], ...CONTROLES_J2[k]];

const TOUCHES_BLOQUEES = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Tab"]);
addEventListener("keydown", (e) => {
  if (TOUCHES_BLOQUEES.has(e.code)) e.preventDefault();
  Son.init();
  if (!e.repeat) { appuis.add(e.code); toucheMenu(e); }
  touches.add(e.code);
});
addEventListener("keyup", (e) => touches.delete(e.code));
addEventListener("blur", () => touches.clear());
function versJeu(e) {
  const r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
}
canvas.addEventListener("mousemove", (e) => { const p = versJeu(e); souris.x = p.x; souris.y = p.y; souris.t = performance.now(); });
canvas.addEventListener("mousedown", (e) => { Son.init(); clicMenu(versJeu(e)); });
addEventListener("resize", redimensionner);

/* ---------- Commandes tactiles (téléphone, tablette) ----------
   Joystick à gauche (bouger, viser le dash, enrouler la corde),
   4 boutons à droite. Le dash se vise avec le joystick, ou en glissant
   le doigt depuis le bouton DASH. */
const TACTILE_RAYON_STICK = 80;
const BOUTONS_TACTILES = [
  { k: "saut",   x: 1150, y: 600, r: 74, txt: "SAUT" },
  { k: "dash",   x: 995, y: 640, r: 64, txt: "DASH" },
  { k: "corde",  x: 1030, y: 492, r: 48, txt: "CORDE" },
  { k: "contre", x: 1172, y: 448, r: 48, txt: "CONTRE" },
];
const BOUTON_PAUSE = { x: 46, y: 46, r: 30 };
const tactile = {
  actif: window.matchMedia && matchMedia("(pointer: coarse)").matches,
  stick: null, drag: null, doigts: {}, appuis: new Set(),
  ctrl: { g: false, d: false, h: false, b: false, saut: false, dash: false, corde: false, contre: false },
};
function vecteurStick() {
  const s = tactile.stick;
  if (!s) return { x: 0, y: 0, l: 0 };
  let x = (s.x - s.ox) / TACTILE_RAYON_STICK, y = (s.y - s.oy) / TACTILE_RAYON_STICK;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  return { x, y, l: Math.min(1, l) };
}
function majCtrlTactile() {
  const c = tactile.ctrl, v = vecteurStick();
  c.g = v.x < -0.18; c.d = v.x > 0.18; c.h = v.y < -0.55; c.b = v.y > 0.55;
  c.sprint = v.l > 0.9;                       // joystick poussé à fond : sprint
  for (const b of BOUTONS_TACTILES) c[b.k] = Object.values(tactile.doigts).includes(b.k);
}
function pleinEcran() {
  const el = document.documentElement;
  if (document.fullscreenElement || !el.requestFullscreen) return;
  el.requestFullscreen({ navigationUI: "hide" })
    .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {}))
    .catch(() => {});
}
const portrait = () => tactile.actif && innerHeight > innerWidth;
addEventListener("touchstart", (e) => {
  e.preventDefault();
  tactile.actif = true; Son.init();
  for (const t of e.changedTouches) {
    const p = versJeu(t);
    if (portrait()) continue;
    if (["titre", "choix", "pause", "finMatch", "replay", "niveaux", "finNiveau", "montage", "commandes"].includes(ecran)) { clicMenu(p); continue; }
    if (Math.hypot(p.x - BOUTON_PAUSE.x, p.y - BOUTON_PAUSE.y) < BOUTON_PAUSE.r * 1.4) { ecranAvantPause = ecran; ecran = "pause"; continue; }
    const b = BOUTONS_TACTILES.find((b) => Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.2);
    if (b) {
      tactile.doigts[t.identifier] = b.k; tactile.appuis.add(b.k);
      if (b.k === "dash") tactile.drag = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y };
    } else if (p.x < W / 2 && !tactile.stick) {
      tactile.stick = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y };
    }
  }
  majCtrlTactile();
}, { passive: false });
addEventListener("touchmove", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = versJeu(t);
    if (tactile.stick && tactile.stick.id === t.identifier) { tactile.stick.x = p.x; tactile.stick.y = p.y; }
    if (tactile.drag && tactile.drag.id === t.identifier) { tactile.drag.x = p.x; tactile.drag.y = p.y; }
  }
  majCtrlTactile();
}, { passive: false });
function finDoigt(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (tactile.stick && tactile.stick.id === t.identifier) tactile.stick = null;
    if (tactile.drag && tactile.drag.id === t.identifier) tactile.drag = null;
    delete tactile.doigts[t.identifier];
  }
  majCtrlTactile();
}
addEventListener("touchend", finDoigt, { passive: false });
addEventListener("touchcancel", finDoigt, { passive: false });

/* =====================================================================
   6. Effets : particules, flashs, textes, tremblement, hitstop
   ===================================================================== */
let particules = [], flashs = [], textes = [], motes = [];
let hitstop = 0;           // temps de gel restant (s, temps réel)
let secousse = 0;          // amplitude du tremblement (px)
let flashEcran = 0;        // voile blanc plein écran (0..1)
let ralenti = 1, ralentiT = 0;  // ralenti après une éjection

const effetsOn = (e) => EFFETS && e;

function geler(p) { if (effetsOn(EFFET_HITSTOP)) hitstop = Math.max(hitstop, lerp(HITSTOP_MIN, HITSTOP_MAX, clamp(p, 0, 1))); }
function trembler(px) { if (effetsOn(EFFET_TREMBLEMENT)) secousse = Math.min(32, Math.max(secousse, px)); }

function eclats(x, y, n, couleur, vit, dirX = 0, dirY = 0, ouverture = Math.PI, grav = 900, taille = 6) {
  if (!effetsOn(EFFET_PARTICULES)) return;
  const base = dirX || dirY ? Math.atan2(dirY, dirX) : 0, ouv = dirX || dirY ? ouverture : Math.PI;
  for (let i = 0; i < n; i++) {
    const a = base + rand(-ouv, ouv), v = vit * rand(0.25, 1);
    particules.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0, max: rand(0.25, 0.7),
      t: rand(2, taille), c: Math.random() < 0.35 ? "#ffffff" : couleur, g: grav, r: rand(0, 6), vr: rand(-12, 12),
    });
  }
}
function poussiere(x, y, n) { eclats(x, y, n, "#c9a38a", 260, 0, -1, 1.2, 600, 4); }

function flash(x, y, r) { if (effetsOn(EFFET_FLASH)) flashs.push({ x, y, r, vie: 0, max: 0.14 }); }

function texte(txt, x, y, couleur, taille = 74) {
  if (!effetsOn(EFFET_TEXTES)) return;
  if (modeJeu === "aventure" && av) { x -= av.cam.x; y -= av.cam.y; }
  textes.push({ txt, x: clamp(x, 260, W - 260), y: clamp(y, 120, H - 120), c: couleur, taille, vie: 0, max: 1.25, rot: rand(-0.08, 0.08) });
}

function majParticules(dt) {
  for (const p of particules) { p.vie += dt; p.vy += p.g * dt; p.vx *= Math.exp(-2 * dt); p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; }
  particules = particules.filter((p) => p.vie < p.max);
}
function majEffetsTempsReel(dt) {
  for (const f of flashs) f.vie += dt;
  flashs = flashs.filter((f) => f.vie < f.max);
  for (const t of textes) t.vie += dt;
  textes = textes.filter((t) => t.vie < t.max);
  secousse *= Math.exp(-11 * dt); if (secousse < 0.2) secousse = 0;
  flashEcran = Math.max(0, flashEcran - dt * 5);
  if (ralentiT > 0) { ralentiT -= dt; if (ralentiT <= 0) ralenti = 1; }
  for (const m of motes) { m.y -= m.v * dt; m.x += Math.sin(m.y * 0.01 + m.p) * 8 * dt; if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; } }
}
for (let i = 0; i < 45; i++) motes.push({ x: Math.random() * W, y: Math.random() * H, v: rand(6, 22), p: rand(0, 6), t: rand(1, 2.5), a: rand(0.05, 0.18) });

/* =====================================================================
   7. Le cube (personnage)
   ===================================================================== */
const DEMI = TAILLE_CUBE / 2;

// Arène courante : PLATS (plateformes) et ANCRES peuvent bouger pendant la partie.
// PF = boîte qui englobe toutes les plateformes (décor, IA).
let arene = ARENES[0], PLATS = [], ANCRES = [], tempsManche = 0;
const PF = { x: 0, y: 0, w: 0, h: 64 };
function chargerArene(a) {
  arene = a; tempsManche = 0;
  PLATS = a.plateformes.map((p) => ({ ...p, x0: p.x, w0: p.w }));
  ANCRES = a.ancres.map((q) => ({ ...q, x0: q.x, y0: q.y, phase: rand(0, 6) }));
  majBoite();
}
function majBoite() {
  PF.x = Math.min(...PLATS.map((p) => p.x));
  PF.w = Math.max(...PLATS.map((p) => p.x + p.w)) - PF.x;
  PF.y = Math.min(...PLATS.map((p) => p.y));
}
function majArene(dt) {
  if (arene.retrecit) {
    const p = PLATS[0], k = clamp(tempsManche / DUREE_MANCHE, 0, 1);
    p.w = lerp(p.w0, arene.retrecit, k); p.x = p.x0 + (p.w0 - p.w) / 2; majBoite();
  }
  for (const a of ANCRES) {
    if (!a.orbite) continue;
    a.phase += a.v * dt;
    if (a.horiz) { a.x = a.x0 + Math.sin(a.phase) * a.orbite * 2; a.y = a.y0; }
    else { a.x = a.x0 + Math.cos(a.phase) * a.orbite; a.y = a.y0 + Math.sin(a.phase) * a.orbite; }
  }
}
const plateformeSous = (x, marge = 0) => PLATS.find((p) => x > p.x - marge && x < p.x + p.w + marge);
function surPlateforme(c) { const p = plateformeSous(c.x, 4); return !!p && c.y < p.y; }
function plateformeProche(x) {
  let mieux = PLATS[0], dmin = 1e9;
  for (const p of PLATS) { const d = Math.max(0, p.x - x, x - (p.x + p.w)); if (d < dmin) { dmin = d; mieux = p; } }
  return mieux;
}
chargerArene(ARENES[0]);

// Petites secousses du téléphone (Android ; l'iPhone ne le permet pas)
function vibrer(motif) { if (!tactile.actif || !navigator.vibrate) return; try { navigator.vibrate(motif); } catch (e) {} }

function ancreProche(c) {
  let mieux = null, dmin = CORDE_PORTEE * (c.perso ? c.perso.portee : 1);
  for (const a of ANCRES) {
    const d = Math.hypot(a.x - c.x, a.y - c.y);
    if (d < dmin) { dmin = d; mieux = a; }
  }
  return mieux;
}

class Cube {
  constructor(num, couleur) {
    this.num = num; this.couleur = couleur; this.nom = "J" + (num + 1);
    this.controles = null;   // touches du joueur humain (null = IA)
    this.ia = null;
    this.ctrl = {}; this.avant = {}; this.presse = {};
    this.trainee = []; this.clignT = rand(1, 4);
    this.perso = PERSOS[num];
    this.reset(PF.x + PF.w / 2);
  }

  reset(x) {
    this.x = x; this.y = (plateformeSous(x) || PF).y - DEMI; this.px = this.x; this.py = this.y;
    this.vx = 0; this.vy = 0;
    this.sol = true; this.sauts = this.perso.sauts; this.sautTenu = false;
    this.dir = this.x < W / 2 ? 1 : -1;
    this.etat = "libre";              // libre | visee | dash | corde
    this.etourdi = 0; this.danger = 0; this.sauvetage = false;
    this.dashCd = 0; this.dashT = 0; this.viseeT = 0; this.viseeDir = { x: this.dir, y: 0 }; this.dashId = 0; this.dashTouche = false;
    this.corde = null; this.cordeCd = 0;
    this.contreT = 0; this.contreCd = 0; this.contreReussi = 0;
    this.angle = 0; this.angV = 0; this.sq = 1; this.sqV = 0; this.flashT = 0;
    this.trainee.length = 0; this.horsJeu = false; this.murT = 0; this.murDir = 0; this.murVerrou = 0; this.coyote = 0; this.dashAir = true; this.solP = null; this.murMat = "";
    for (const k of ["g", "d", "h", "b", "saut", "dash", "corde", "contre", "sprint"]) { this.ctrl[k] = false; this.avant[k] = false; this.presse[k] = false; }
  }

  // Lit les touches (joueur humain) ou laisse l'IA remplir this.ctrl
  lireControles(actif, dt) {
    const c = this.ctrl;
    for (const k in c) this.avant[k] = c[k];
    if (!actif) { for (const k in c) c[k] = false; }
    else if (this.ia) this.ia.penser(dt);
    else for (const k in c) {
      c[k] = this.controles[k].some((code) => touches.has(code));
      if (this.num === 0 && tactile.actif) c[k] = c[k] || !!tactile.ctrl[k];
      if (this.num === 0 && manette.ctrl[k]) c[k] = true;
    }
    for (const k in c) {
      const latch = actif && !this.ia && (this.controles[k].some((code) => appuis.has(code)) || (this.num === 0 && (tactile.appuis.has(k) || manette.appuis.has(k))));
      this.presse[k] = (c[k] && !this.avant[k]) || latch;
    }
  }

  // Direction de visée du dash
  calculerVisee() {
    if (this.ia) return this.ia.visee;
    const c = this.ctrl;
    if (this.num === 0 && tactile.actif) {
      const v = vecteurStick();
      if (v.l > 0.3) return { x: v.x / v.l, y: v.y / v.l };
      const d = tactile.drag;
      if (d && Math.hypot(d.x - d.ox, d.y - d.oy) > 18) {
        const l = Math.hypot(d.x - d.ox, d.y - d.oy);
        return { x: (d.x - d.ox) / l, y: (d.y - d.oy) / l };
      }
    }
    let dx = (c.d ? 1 : 0) - (c.g ? 1 : 0), dy = (c.b ? 1 : 0) - (c.h ? 1 : 0);
    if (dx === 0 && dy === 0) {
      if (this.num === 0 && physique !== PHYS_AVENTURE && performance.now() - souris.t < 2500) {
        const cam = modeJeu === "aventure" && av ? av.cam : { x: 0, y: 0 };   // la souris est en coordonnées écran
        dx = souris.x + cam.x - this.x; dy = souris.y + cam.y - this.y;
      }
      else { dx = this.dir; dy = 0; }
    }
    const l = Math.hypot(dx, dy) || 1;
    return { x: dx / l, y: dy / l };
  }

  accrocher(a) {
    const d = Math.hypot(a.x - this.x, a.y - this.y);
    this.etat = "corde";
    this.corde = { a, long: clamp(d, CORDE_LONG_MIN, CORDE_PORTEE * this.perso.portee), t: 0, anim: 0 };
    this.dashAir = true;
    if (this.danger > 0 || !surPlateforme(this)) this.sauvetage = true;
    Son.zip();
  }
  lacherCorde(sansBoost) {
    if (!sansBoost) { this.vx *= CORDE_BOOST; this.vy *= CORDE_BOOST; }
    this.etat = "libre"; this.corde = null; this.cordeCd = CORDE_RECHARGE * this.perso.cordeCd;
    this.sauts = Math.max(this.sauts, 1);
  }
  lancerDash() {
    const ratio = clamp(this.viseeT / DASH_VISEE_MAX, 0, 1);
    const v = DASH_VITESSE * lerp(physique === PHYS_AVENTURE ? AV_DASH_MIN : DASH_VITESSE_MIN, 1, ratio);
    this.viseeDir = this.calculerVisee();
    this.vx = this.viseeDir.x * v; this.vy = this.viseeDir.y * v;
    const av_ = physique === PHYS_AVENTURE;
    this.etat = "dash"; this.dashT = av_ ? AV_DASH_DUREE : DASH_DUREE; this.dashCd = (av_ ? AV_DASH_RECHARGE : DASH_RECHARGE) * this.perso.dashCd;
    if (physique === PHYS_AVENTURE) this.dashAir = false;
    this.dashTouche = false; this.dashId++; this.sautTenu = false;
    if (this.viseeDir.x) this.dir = signe(this.viseeDir.x);
    this.sqV += Math.abs(this.viseeDir.y) > Math.abs(this.viseeDir.x) ? 7 : -7;
    Son.dash(ratio);
  }
  finDash() {
    this.etat = "libre"; this.apresDash = APRES_DASH;
    if (physique === PHYS_AVENTURE) {   // on garde l'élan à l'horizontale : le dash enchaîne sur la course
      const garde = 1.25 * physique.vmax * this.perso.vitesse;
      this.vx = signe(this.vx) * Math.min(Math.abs(this.vx), garde); this.vy *= DASH_FIN_ELAN;
    } else { this.vx *= DASH_FIN_ELAN; this.vy *= DASH_FIN_ELAN; }
  }

  maj(dt) {
    const c = this.ctrl, pr = this.presse;
    // --- minuteurs ---
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.cordeCd = Math.max(0, this.cordeCd - dt);
    this.contreCd = Math.max(0, this.contreCd - dt);
    this.etourdi = Math.max(0, this.etourdi - dt);
    this.danger = Math.max(0, this.danger - dt);
    this.flashT = Math.max(0, this.flashT - dt);
    this.contreReussi = Math.max(0, this.contreReussi - dt);
    if (this.contreT > 0) {
      this.contreT -= dt;
      if (this.contreT <= 0) { this.contreT = 0; this.contreCd = physique === PHYS_AVENTURE ? AV_CONTRE_PENALITE : CONTRE_RECHARGE_RATE; }  // contre raté
    }
    const libreDeBouger = this.etourdi <= 0;

    // --- contre ---
    if (pr.contre && libreDeBouger && this.contreT <= 0 && this.contreCd <= 0 && this.etat !== "dash") {
      this.contreT = physique === PHYS_AVENTURE ? AV_CONTRE_FENETRE : CONTRE_FENETRE; Son.armeContre();
    }

    // --- corde (autorisée même étourdi : c'est le « rope save ») ---
    if (this.etat === "corde") {
      this.corde.t += dt; this.corde.anim = Math.min(1, this.corde.anim + dt / 0.06);
      if (!c.corde || this.corde.t > CORDE_DUREE_MAX) this.lacherCorde();
    } else if (pr.corde && !this.sol && this.cordeCd <= 0 && this.etat !== "dash") {
      const a = ancreProche(this);
      if (a) { if (this.etat === "visee") this.etat = "libre"; this.accrocher(a); }
      else this.cordeCd = 0.15;
    }

    // --- dash : appuyer = viser, relâcher = foncer ---
    if (this.sol) this.dashAir = true;
    const dashDispo = this.dashAir || physique !== PHYS_AVENTURE;
    this.tamponDash = Math.max(0, (this.tamponDash || 0) - dt);
    if (pr.dash) this.tamponDash = AV_DASH_TAMPON;
    if (physique === PHYS_AVENTURE) {
      // aventure : le dash part tout de suite, dans la direction tenue (8 directions), sinon droit devant
      if (this.tamponDash > 0 && libreDeBouger && this.dashCd <= 0 && dashDispo && (this.etat === "libre" || this.etat === "corde")) {
        if (this.etat === "corde") this.lacherCorde(true);
        this.tamponDash = 0; this.viseeT = DASH_VISEE_MAX; this.lancerDash();
      }
    } else if (this.etat === "visee") {
      this.viseeT += dt; this.viseeDir = this.calculerVisee();
      if (!c.dash || this.viseeT >= DASH_VISEE_MAX) this.lancerDash();
    } else if (pr.dash && libreDeBouger && this.dashCd <= 0 && dashDispo && (this.etat === "libre" || this.etat === "corde")) {
      if (this.etat === "corde") this.lacherCorde(true);
      this.etat = "visee"; this.viseeT = 0; this.viseeDir = this.calculerVisee();
      if (!c.dash) this.lancerDash();       // simple tapotement : dash immédiat
    }
    if (this.etat === "dash") { this.dashT -= dt; if (this.dashT <= 0) this.finDash(); }

    // --- déplacement ---
    this.apresDash = Math.max(0, (this.apresDash || 0) - dt);
    this.murT = Math.max(0, this.murT - dt); this.murVerrou = Math.max(0, this.murVerrou - dt); this.coyote = Math.max(0, this.coyote - dt);
    if (this.sol) this.coyote = COYOTE;
    const ix = this.murVerrou > 0 ? 0 : (c.d ? 1 : 0) - (c.g ? 1 : 0);
    const sprinte = physique === PHYS_AVENTURE && this.num === 0 && (c.sprint || reglages.courseAuto);
    const vmax = physique.vmax * this.perso.vitesse * (sprinte ? SPRINT_MULT : 1);
    const glace = this.sol && this.solP && this.solP.mat === "i";   // sol glacé
    if (this.etat === "libre") {
      const f = libreDeBouger ? 1 : 0.2;
      if (ix !== 0) {
        if (ix * this.vx < vmax) {
          this.vx += ix * (this.sol ? physique.accelSol * (glace ? GLACE_ADHERENCE * 2 : 1) : physique.accelAir) * this.perso.vitesse * f * dt;
          if (ix * this.vx > vmax) this.vx = ix * vmax;
        }
        if (libreDeBouger) this.dir = ix;
      }
      let frot = FROTTEMENT_AIR;
      if (this.sol) {
        frot = ix === 0 || ix * this.vx < 0 ? FROTTEMENT_SOL : 0;
        if (Math.abs(this.vx) > vmax) frot = Math.max(frot, FROTTEMENT_SOL * (physique === PHYS_AVENTURE ? 0.15 : 0.45));
        if (!libreDeBouger) frot *= 0.35;   // on glisse quand on est sonné
        if (glace) frot *= GLACE_ADHERENCE;
      }
      this.vx *= Math.exp(-frot * dt);
      if (sprinte && this.sol && Math.abs(this.vx) > physique.vmax && Math.random() < 0.3) poussiere(this.x - signe(this.vx) * DEMI, this.y + DEMI, 1);
      // sauts
      this.tamponSaut = Math.max(0, (this.tamponSaut || 0) - dt);
      const sautDemande = pr.saut || (this.tamponSaut > 0 && (this.sol || this.coyote > 0));
      if (sautDemande && libreDeBouger) {
        if (this.sol || this.coyote > 0) {
          this.tamponSaut = 0;
          this.vy = -physique.saut * this.perso.saut; this.sol = false; this.coyote = 0; this.sauts = this.perso.sauts - 1; this.sautTenu = true;
          this.sqV += 6; poussiere(this.x, this.y + DEMI, 6); Son.saut(0);
        } else if (this.murT > 0) {
          // rebond contre un mur : on repart dans l'autre sens
          this.vx = -this.murDir * MUR_SAUT_X; this.vy = -MUR_SAUT_Y * (physique.saut / 900);
          this.dir = -this.murDir; this.murT = 0; this.murVerrou = MUR_VERROU; this.sautTenu = true;
          this.sauts = Math.max(this.sauts, this.perso.sauts - 1);
          this.sqV += 5; this.angV -= this.murDir * 10;
          eclats(this.x + this.murDir * DEMI, this.y, 8, "#ffffff", 260, -this.murDir, 0, 0.8, 300, 4); Son.saut(1);
        } else if (this.sauts > 0) {
          this.vy = -physique.double * this.perso.saut; this.sauts--; this.sautTenu = true; evenement("doublesaut", this);
          this.sqV += 5; this.angV += this.dir * 9;
          eclats(this.x, this.y + DEMI, 8, this.couleur, 220, 0, 1, 0.9, 200, 4); Son.saut(1);
        } else if (pr.saut) this.tamponSaut = TAMPON_SAUT;   // trop tôt : on le garde pour l'atterrissage
      }
      if (this.sautTenu && !c.saut && this.vy < 0) { this.vy *= physique.coupe; this.sautTenu = false; }
      if (this.vy >= 0) this.sautTenu = false;
    } else if (this.etat === "visee") {
      // pendant la visée, le cube freine fort (et flotte)
      this.vx *= Math.exp(-7 * dt); this.vy *= Math.exp(-7 * dt);
    } else if (this.etat === "corde") {
      const a = this.corde.a, dx = this.x - a.x, dy = this.y - a.y, d = Math.hypot(dx, dy) || 1;
      const tx = -dy / d, ty = dx / d;               // direction du balancement
      const pousse = ix * CORDE_BALANCE * tx;        // on ne pousse que dans le sens horizontal voulu
      this.vx += tx * pousse * dt; this.vy += ty * pousse * dt;
      if (c.h) this.corde.long = Math.max(CORDE_LONG_MIN, this.corde.long - CORDE_ENROULER * dt);
      if (c.b) this.corde.long = Math.min(CORDE_PORTEE * this.perso.portee, this.corde.long + CORDE_ENROULER * dt);
      if (ix) this.dir = ix;
    }

    // --- gravité ---
    if (this.etat !== "dash") {
      let g = physique.gravite * (this.vy > 0 ? physique.chute : 1);
      if (this.etat === "visee") g *= 0.15;
      // glissade contre un mur quand on pousse dedans
      if (this.etat === "libre" && this.murT > 0 && !this.sol && this.vy >= 0 && ix === this.murDir && this.murMat === "v") {
        this.vy = 0; g = 0;                          // mur collant : on reste accroché tant qu'on pousse
      } else if (this.etat === "libre" && this.murT > 0 && !this.sol && this.vy > MUR_GLISSE && ix === this.murDir) {
        this.vy = MUR_GLISSE; g = 0;
        if (Math.random() < 0.3) eclats(this.x + this.murDir * DEMI, this.y + DEMI * 0.5, 1, "#c9a38a", 80, 0, -1, 0.5, 100, 3);
      }
      this.vy = Math.min(this.vy + g * dt, Math.max(physique.chuteMax, this.vy));
    }

    // --- intégration ---
    this.px = this.x; this.py = this.y;
    this.x += this.vx * dt; this.y += this.vy * dt;

    // --- corde : pendule rigide (longueur fixe, on retire la vitesse le long de la corde) ---
    if (this.etat === "corde") {
      const a = this.corde.a, dx = this.x - a.x, dy = this.y - a.y, d = Math.hypot(dx, dy) || 1;
      const nx = dx / d, ny = dy / d;
      this.x = a.x + nx * this.corde.long; this.y = a.y + ny * this.corde.long;
      const vr = this.vx * nx + this.vy * ny;
      this.vx -= vr * nx; this.vy -= vr * ny;
    }

    // --- plateforme ---
    const etaitAuSol = this.sol;
    this.sol = false; this.solP = null;
    this.collisionPlateforme(etaitAuSol);

    // --- rotation selon l'élan ---
    if (this.sol && this.etat !== "dash") {
      const cible = Math.round(this.angle / (Math.PI / 2)) * (Math.PI / 2);
      this.angle += (cible - this.angle) * Math.min(1, 16 * dt); this.angV = 0;
    } else {
      this.angV += (this.vx * ROTATION_ELAN - this.angV) * Math.min(1, 3.5 * dt);
      this.angle += this.angV * dt;
    }

    // --- squash & stretch : ressort amorti autour d'une forme cible ---
    let cible = 1;
    if (!this.sol) cible = 1 + clamp((Math.abs(this.vy) - Math.abs(this.vx)) / 3400, -0.18, 0.18);
    else cible = 1 - Math.min(0.1, Math.abs(this.vx) / 4500);
    if (this.etat === "visee") cible = 1 - 0.2 * clamp(this.viseeT / DASH_VISEE_MAX, 0, 1);
    this.sqV += ((cible - this.sq) * 330 - this.sqV * 13) * dt;
    this.sq = clamp(this.sq + this.sqV * dt, 0.65, 1.45);

    // --- traînée d'images fantômes ---
    if (effetsOn(EFFET_TRAINEE)) {
      const v = Math.hypot(this.vx, this.vy);
      this.trainT = (this.trainT || 0) - dt;
      if ((v > 720 || this.etat === "dash") && this.trainT <= 0) {
        this.trainT = 1 / 60;
        this.trainee.push({ x: this.x, y: this.y, a: this.angle, sq: this.sq, vie: 0 });
      }
      for (const t of this.trainee) t.vie += dt;
      while (this.trainee.length && this.trainee[0].vie > 0.2) this.trainee.shift();
    }

    // clignement des yeux
    this.clignT -= dt; if (this.clignT < -0.12) this.clignT = rand(1.5, 4.5);
  }

  collisionPlateforme(etaitAuSol) { for (const p of PLATS) this.collisionRect(p, etaitAuSol); }

  collisionRect(P, etaitAuSol) {
    if (P.off > 0) return;                     // bloc effondré ou tourelle détruite
    const G = P.x, D = P.x + P.w, Hh = P.y, B = P.y + P.h;
    if (!(this.x + DEMI > G && this.x - DEMI < D && this.y + DEMI > Hh && this.y - DEMI < B)) return;
    // de quel côté arrive-t-on ? (sinon, en longeant un mur fait de plusieurs blocs, on se cognerait à chaque jointure)
    let vertical = true;
    if (!(this.px + DEMI > G && this.px - DEMI < D)) {
      if (this.py + DEMI > Hh && this.py - DEMI < B) vertical = false;
      else vertical = Math.min(this.y + DEMI - Hh, B - (this.y - DEMI)) < Math.min(this.x + DEMI - G, D - (this.x - DEMI));
    }
    if (vertical && this.py + DEMI <= Hh + 2 && this.vy >= 0) {
      // atterrissage sur le dessus
      const choc = this.vy;
      this.y = Hh - DEMI; this.vy = 0; this.sol = true; this.sauts = this.perso.sauts; this.solP = P;
      if (P.mat === "x" && P.t <= 0) P.t = FRIABLE_DELAI * (av && av.sombre ? 0.6 : 1);   // bloc friable : il va tomber
      if (P.mat === "j") {                                    // gelée : rebond automatique
        this.vy = -GELEE_REBOND; this.sol = false; this.sauts = this.perso.sauts - 1; this.dashAir = true; this.sqV += 8;
        eclats(this.x, Hh, 10, ROSE, 380, 0, -1, 0.8, 600, 5); if (Son.pret()) Son.osc("sine", 180, 700, 0.2, 0.06);
        return;
      }
      if (this.etat === "corde") this.lacherCorde(true);
      if (this.etat === "dash" && this.viseeDir.y > 0.3) {
        this.finDash(); trembler(4); poussiere(this.x, Hh, 14); Son.boum(0.2);
      }
      if (!etaitAuSol) {
        if (choc > 250) { this.sqV -= choc * 0.0065; poussiere(this.x, Hh, Math.min(14, choc / 80)); }
        if (choc > 1000) trembler(3);
        if (this.sauvetage) { this.sauvetage = false; texte("ROPE SAVE!", this.x, this.y - 90, this.couleur); Son.fanfare(); evenement("ropesave", this); }
      }
    } else if (vertical && this.py - DEMI >= B - 2 && this.vy < 0) {
      // la tête frôle le coin : on se décale un peu au lieu de se cogner
      if (physique === PHYS_AVENTURE && this.x + DEMI - G <= COIN_AIDE && !solideEn(G - 1, Hh + 2)) { this.x = G - DEMI; return; }
      if (physique === PHYS_AVENTURE && D - (this.x - DEMI) <= COIN_AIDE && !solideEn(D + 1, Hh + 2)) { this.x = D + DEMI; return; }
      this.y = B + DEMI; this.vy = 0;           // tête contre le dessous
    } else {
      // côtés de la plateforme
      const rebond = this.etat === "dash" ? 0.25 : 0;
      if (this.x < P.x + P.w / 2) { this.x = G - DEMI; if (this.vx > 0) this.vx = -this.vx * rebond; this.murDir = 1; }
      else { this.x = D + DEMI; if (this.vx < 0) this.vx = -this.vx * rebond; this.murDir = -1; }
      if (!this.sol && P.mat !== "i") this.murT = 0.12;   // mur glacé : ni glissade ni rebond
      this.murMat = P.mat || "";
      if (this.etat === "dash") this.finDash();
    }
  }

  sortiDeLEcran() { return this.x < -MARGE_SORTIE || this.x > W + MARGE_SORTIE || this.y > H + MARGE_SORTIE; }
}

/* =====================================================================
   8. Combats : collisions entre cubes, coups, contres
   ===================================================================== */
function collisionCubes(a, b) {
  if (a.horsJeu || b.horsJeu) return;
  const dx = b.x - a.x, dy = b.y - a.y;
  const ox = TAILLE_CUBE - Math.abs(dx), oy = TAILLE_CUBE - Math.abs(dy);
  if (ox <= 0 || oy <= 0) return;
  const aD = a.etat === "dash" && !a.dashTouche, bD = b.etat === "dash" && !b.dashTouche;
  if (aD && !bD) return frapper(a, b, false);
  if (bD && !aD) return frapper(b, a, false);
  if (aD && bD) {   // deux dashs : le plus rapide gagne, l'autre est repoussé aussi
    const va = Math.hypot(a.vx, a.vy), vb = Math.hypot(b.vx, b.vy);
    return va >= vb ? frapper(a, b, true) : frapper(b, a, true);
  }
  // simple contact : on se pousse comme deux sumos
  if (ox < oy) {
    const s = signe(dx) || 1;
    a.x -= (s * ox) / 2; b.x += (s * ox) / 2;
    const rel = (a.vx - b.vx) * s;
    if (rel > 0) {
      const j = rel * 0.6; a.vx -= s * j; b.vx += s * j;
      if (rel > 900) { trembler(rel * 0.004); Son.boum(0.15); eclats((a.x + b.x) / 2, (a.y + b.y) / 2, 6, "#ffffff", 300); }
    }
  } else {
    const haut = dy > 0 ? a : b, bas = dy > 0 ? b : a;
    haut.y = bas.y - TAILLE_CUBE;
    if (haut.vy > bas.vy) haut.vy = bas.vy;
    haut.sol = true; haut.sauts = haut.perso.sauts;
    if (haut.etat === "corde") haut.lacherCorde(true);
    haut.vx += signe(haut.x - bas.x || 1) * 40;   // on glisse doucement de la tête de l'autre
  }
}

function frapper(att, def, choc) {
  att.dashTouche = true;
  if (def.contreT > 0) return contrer(def, att);
  const v = Math.hypot(att.vx, att.vy) || 1;
  const nx = att.vx / v, ny = att.vy / v;
  // direction du recul : surtout dans le sens du dash, un peu vers le haut
  let kx = nx, ky = ny * 0.5 - RECUL_VERS_HAUT;
  if (Math.abs(kx) < 0.35) kx = (signe(def.x - att.x) || att.dir) * 0.35;
  if (def.sol && ky > -0.15) ky = -0.15;
  const kl = Math.hypot(kx, ky); kx /= kl; ky /= kl;
  const force = (RECUL_BASE + v * RECUL_PAR_VITESSE) * def.perso.recul;
  def.vx = kx * force; def.vy = ky * force;
  if (def.etat !== "libre") { def.etat = "libre"; def.corde = null; }
  def.contreT = 0;
  def.etourdi = ETOURDI; def.danger = 2.5; def.sol = false; def.sautTenu = false;
  def.angV += kx * 16; def.sqV += 8; def.flashT = 0.09;
  // l'attaquant rebondit un peu
  att.etat = "libre";
  att.vx = choc ? -nx * force * 0.35 : -nx * 160; att.vy = choc ? -320 : -240; att.sqV -= 5;
  if (choc) att.etourdi = 0.18;
  // effets
  const p = clamp((force - RECUL_BASE) / (DASH_VITESSE * RECUL_PAR_VITESSE), 0, 1);
  const ix = (att.x + def.x) / 2, iy = (att.y + def.y) / 2;
  geler(p); trembler(force * TREMBLEMENT); flash(ix, iy, 50 + 50 * p);
  if (effetsOn(EFFET_FLASH)) flashEcran = Math.max(flashEcran, 0.12 + 0.18 * p);
  eclats(ix, iy, 16 + Math.round(18 * p), def.couleur, 500 + 500 * p, kx, ky, 0.9);
  Son.boum(p);
  if (def === j1 || att === j1) vibrer(def === j1 ? 60 : 30);
  evenement("coup", att);
}

function contrer(def, att) {
  const v = Math.max(Math.hypot(att.vx, att.vy), DASH_VITESSE * 0.6);
  const nx = att.vx / (Math.hypot(att.vx, att.vy) || 1), ny = att.vy / (Math.hypot(att.vx, att.vy) || 1);
  const force = v * CONTRE_MULT * att.perso.recul;
  // l'attaquant repart en sens inverse, plus fort
  att.vx = -nx * force; att.vy = -ny * force * 0.5 - force * 0.3;
  att.etat = "libre"; att.corde = null; att.etourdi = ETOURDI * 1.5; att.danger = 2.5; att.sol = false;
  att.flashT = 0.1; att.sqV += 9; att.angV -= nx * 20;
  def.contreT = 0; def.contreCd = 0; def.contreReussi = 0.35;
  def.vx *= 0.1; def.vy = Math.min(def.vy, 0);
  geler(1); trembler(22); flash(def.x, def.y, 120);
  if (effetsOn(EFFET_FLASH)) flashEcran = Math.max(flashEcran, 0.35);
  eclats(def.x, def.y, 30, "#ffffff", 900, -nx, -ny, 1.1, 300, 7);
  texte("CONTRE !", def.x, def.y - 100, def.couleur);
  Son.cling(); Son.boum(0.5);
  if (def === j1 || att === j1) vibrer(80);
  evenement("contre", def);
}

/* =====================================================================
   9. IA (mode solo)
   ===================================================================== */
class IA {
  constructor(moi, adv, niveau = NIVEAUX_IA[1]) {
    this.moi = moi; this.adv = adv; this.n = niveau;
    this.prochaine = 0; this.mx = 0; this.sautCd = 0;
    this.charge = 0; this.chargeVoulue = 0; this.cible = null; this.erreur = 0;
    this.visee = { x: 1, y: 0 };
    this.dashJuge = -1; this.veutContrer = false; this.veutSauter = false;
    this.enDanger = false; this.cordeOk = true;
  }
  viserVers(x, y) {
    const m = this.moi, a = Math.atan2(y - m.y, x - m.x) + this.erreur;
    this.visee = { x: Math.cos(a), y: Math.sin(a) };
  }
  lancer(cible, charge) {
    this.cible = cible; this.charge = 0; this.chargeVoulue = charge;
    this.erreur = cible === "adv" ? rand(-this.n.imprecision, this.n.imprecision) : 0;
    this.moi.ctrl.dash = true; this.majVisee();
  }
  majVisee() {
    const a = this.adv;
    if (this.cible === "adv") this.viserVers(a.x + a.vx * 0.12, a.y + a.vy * 0.08 - 6);
    else if (this.cible) this.viserVers(this.cible.x, this.cible.y);
  }
  penser(dt) {
    const m = this.moi, a = this.adv, c = m.ctrl;
    const dashTenu = c.dash;
    for (const k in c) c[k] = false;
    this.prochaine -= dt; this.sautCd -= dt;
    const dx = a.x - m.x, dy = a.y - m.y, dist = Math.hypot(dx, dy);

    // 1) Accrochée à la corde : se balancer puis lâcher vers la plateforme la plus proche
    if (m.etat === "corde") {
      c.corde = true;
      const p = plateformeProche(m.x), cx = p.x + p.w / 2, vers = signe(cx - m.x);
      c[m.vx > 0 ? "d" : "g"] = true;                         // pousser dans le sens du balancement
      if (m.y > p.y + 30) c.h = true;                          // remonter si on est trop bas
      const auDessus = m.y < p.y - 25;
      if ((auDessus && m.vx * vers > 260) || m.corde.t > 2.3) c.corde = false;
      return;
    }
    // 2) En train de viser un dash
    if (m.etat === "visee") {
      this.charge += dt; this.majVisee();
      c.dash = dashTenu && this.charge < this.chargeVoulue;
      return;
    }
    // 3) En danger : en l'air et plus au-dessus d'une plateforme
    const sous = plateformeSous(m.x, 4);
    if (!m.sol && (!sous || m.y > sous.y - 2)) {
      if (!this.enDanger) { this.enDanger = true; this.cordeOk = Math.random() < this.n.corde; }
      const p = plateformeProche(m.x), cx = p.x + p.w / 2, vers = signe(cx - m.x);
      c[vers > 0 ? "d" : "g"] = true;
      const anc = ancreProche(m);
      const tombe = m.vy > 80 || m.y > p.y - 10;
      const loin = Math.abs(m.x - cx) > p.w / 2 + 120;
      if (this.cordeOk && anc && m.cordeCd <= 0 && (tombe || (loin && m.vx * vers < -300)) && (loin || m.y > p.y)) { c.corde = true; return; }
      if (m.etourdi > 0) return;
      if (m.sauts > 0 && m.vy > 0 && this.sautCd <= 0 && m.y < p.y + 140) { c.saut = true; this.sautCd = 0.3; return; }
      if (m.dashCd <= 0 && m.etat === "libre" && m.y > p.y - 30) this.lancer({ x: clamp(m.x, p.x + 40, p.x + p.w - 40), y: p.y - 90 }, 0.05);
      return;
    }
    if (m.sol) this.enDanger = false;
    // 4) Contre : l'adversaire fonce sur elle
    if (a.etat === "dash" && !a.dashTouche) {
      if (this.dashJuge !== a.dashId) { this.dashJuge = a.dashId; this.veutContrer = Math.random() < this.n.contre; }
      const vRap = -(a.vx * dx + a.vy * dy) / (dist || 1);   // vitesse de rapprochement
      const tAvantContact = (dist - TAILLE_CUBE) / Math.max(1, vRap);
      if (this.veutContrer && vRap > 300 && tAvantContact < rand(0.04, 0.12) && m.contreCd <= 0 && m.contreT <= 0) {
        c.contre = true; this.veutContrer = false;
      }
    }
    if (m.etourdi > 0) return;
    // 5) Décisions (toutes les n.reaction secondes) : approcher, sauter, attaquer
    if (this.prochaine <= 0) {
      this.prochaine = this.n.reaction * rand(0.6, 1.4);
      const advSous = plateformeSous(a.x);
      const advHors = !advSous || a.y > advSous.y;
      if (Math.abs(dx) > 80) this.mx = signe(dx);
      else this.mx = Math.random() < 0.5 ? 0 : -signe(dx);
      if (advHors && sous) {                                    // garder le bord
        const bord = clamp(a.x, sous.x + 70, sous.x + sous.w - 70);
        this.mx = Math.abs(bord - m.x) < 12 ? 0 : signe(bord - m.x);
      }
      this.veutSauter = (dy < -90 && Math.abs(dx) < 220 && Math.random() < 0.5) || Math.random() < 0.05;
      if (m.dashCd <= 0 && dist < this.n.portee && Math.random() < this.n.agressivite) {
        this.lancer("adv", rand(0.06, 0.38));
        return;
      }
    }
    // marcher sans tomber ; sauter le vide si une autre plateforme est proche
    if (sous && this.mx) {
      const bordD = sous.x + sous.w, bordG = sous.x;
      const auBord = this.mx > 0 ? m.x > bordD - 34 : m.x < bordG + 34;
      const ile = PLATS.some((p) => p !== sous && (this.mx > 0 ? p.x >= bordD && p.x - bordD < 260 : p.x + p.w <= bordG && bordG - (p.x + p.w) < 260));
      if (!auBord) c[this.mx > 0 ? "d" : "g"] = true;
      else if (ile && signe(a.x - m.x) === this.mx) {
        c[this.mx > 0 ? "d" : "g"] = true;
        if (m.sol && this.sautCd <= 0) { c.saut = true; this.sautCd = 0.4; }
      }
    }
    if (this.veutSauter && this.sautCd <= 0) { c.saut = true; this.veutSauter = false; this.sautCd = 0.35; }
  }
}

// Le mannequin de l'entraînement : immobile, il fonce sur le joueur pendant l'étape du contre
class Mannequin {
  constructor(moi, cible) { this.moi = moi; this.cible = cible; this.t = 1.5; this.visee = { x: -1, y: 0 }; }
  penser(dt) {
    const m = this.moi, c = m.ctrl;
    for (const k in c) c[k] = false;
    if (tuto.etape !== 4) return;
    this.t -= dt;
    if (this.t <= 0 && m.sol && m.dashCd <= 0 && Math.abs(this.cible.x - m.x) > 120) {
      const dx = this.cible.x - m.x, dy = this.cible.y - m.y, l = Math.hypot(dx, dy) || 1;

// --- Survie ---

// --- Ralenti de la dernière éjection ---

let enreg = [], replayCapture = null, dernierReplay = null, replay = null;

// --- Entraînement ---
const ETAPES_TUTO = [

  j2.perso = PERSOS[0]; j2.controles = CONTROLES_VIDES; j2.ia = new Mannequin(j2, j1); j2.nom = "MANNEQUIN";

function majTuto(dt) {

}

// Un pas de simulation (temps de jeu, ralenti compris)
function pasSimulation(dt) {
  if (ecran === "commandes") { appuis.clear(); manette.appuis.clear(); return; }
  const demo = ecran === "titre" || ecran === "choix" || ecran === "niveaux";
  const jeuActif = ecran === "jeu" || ecran === "point" || ecran === "tuto" || ecran === "aventure" || demo;
  if (ecran === "jeu" || ecran === "point" || ecran === "tuto") tempsManche += dt;
  majArene(dt);
  for (const c of cubes) c.lireControles(jeuActif && !c.horsJeu, dt);
  appuis.clear(); tactile.appuis.clear(); manette.appuis.clear();
  for (const c of cubes) if (!c.horsJeu) c.maj(dt);
  collisionCubes(j1, j2);
  majParticules(dt);
  if (modeJeu === "aventure" && (ecran === "aventure" || ecran === "finNiveau" || ecran === "montage")) return majAventure(dt);
  if (!demo && ecran !== "tuto") enregistrer(dt);

  if (demo) {
    // démo en fond : IA contre IA, on recommence après chaque éjection
    for (const c of cubes) if (!c.horsJeu && c.sortiDeLEcran()) { ejection(c); minuteur = 1; }
    if (cubes.some((c) => c.horsJeu)) { minuteur -= dt; if (minuteur <= 0) placerCubes(); }
    return;
  }
  if (ecran === "tuto") return majTuto(dt);
  if (ecran === "jeu") {
    const sortis = cubes.filter((c) => !c.horsJeu && c.sortiDeLEcran());
    for (const c of sortis) ejection(c);
    if (modeJeu === "survie") { if (sortis.length) resultatSurvie(sortis); return; }
    if (sortis.length === 1) marquer(1 - sortis[0].num);
    else if (sortis.length === 2) { message("ÉGALITÉ", "", "#fff", 1); ecran = "point"; minuteur = 1; }
    if (ecran === "jeu" && !mortSubite) {
      chrono -= dt;
      if (chrono <= 5 && Math.ceil(chrono) !== Math.ceil(chrono + dt)) Son.bip(chrono <= 0.01);
      if (chrono <= 0) {
        chrono = 0;
        if (points[0] !== points[1]) finirManche(points[0] > points[1] ? 0 : 1);
        else { mortSubite = true; message("MORT SUBITE", "Le prochain point gagne", "#fff", 1.6); }
      }
    }
    return;
  }
  minuteur -= dt;
  if (ecran === "point") {
    // le survivant peut encore tomber : pas de point en plus, mais on le retire
    for (const c of cubes) if (!c.horsJeu && c.sortiDeLEcran()) ejection(c);
    if (minuteur <= 0) {
      if (modeJeu === "survie") return suiteSurvie();
      const fini = mortSubite === "fin" || (chrono <= 0 && points[0] !== points[1]);
      if (fini) { mortSubite = false; finirManche(points[0] > points[1] ? 0 : 1); }
      else relancerApresPoint();
    }
  } else if (ecran === "depart") {
    if (minuteur <= 0) { ecran = "jeu"; message("GO !", "", "#fff", 0.6); Son.bip(true); }
  } else if (ecran === "finManche") {
    if (minuteur <= 0) nouvelleManche();
  }
}

function medaille(i, t) {
  const m = NIVEAUX[i].medailles;
  if (!m || t == null) return 0;
  return t <= m[0] ? 3 : t <= m[1] ? 2 : t <= m[2] ? 1 : 0;
}
// longueur d'un trajet écrit avec - (vers la droite) ou | (vers le bas) à côté d'un objet
function trajet(grille, tx, ty, w) {
  let dx = 0, dy = 0;
  while (grille[ty][tx + w + dx] === "-") dx++;
  while (grille[ty + 1 + dy]?.[tx] === "|") dy++;
  return { dx: dx * TUILE, dy: dy * TUILE };
}

  // cube doré
  if (av.dore && !av.dorePris && Math.hypot(j1.x - av.dore.x, j1.y - av.dore.y) < 40) {
    av.dorePris = true; eclats(av.dore.x, av.dore.y, 30, OR, 600); flash(av.dore.x, av.dore.y, 90); Son.fanfare(); vibrer([20, 20, 20]);
    texte("CUBE DORÉ !", av.dore.x, av.dore.y - 80, OR, 50);
  }
  // scies sur rail
  for (const s of av.scies) {
    s.t += dt * av.dur;
    const dist = Math.max(s.dx, s.dy);
    if (dist > 0) {
      const u = 0.5 - 0.5 * Math.cos((s.t / ((2 * dist) / SCIE_VITESSE)) * Math.PI * 2);
      s.x = s.x0 + s.dx * u; s.y = s.y0 + s.dy * u;
    }
    if (Math.hypot(j1.x - s.x, j1.y - s.y) < SCIE_RAYON + DEMI - 8) return mourir();
  }
  // tourelles
  for (const t of av.tourelles) {
    if (t.mort) continue;
    const dx = j1.x - t.x, dy = j1.y - t.y;
    t.vise = Math.atan2(dy, dx);
    if (Math.hypot(dx, dy) < TOURELLE_PORTEE) { t.cd -= dt * av.dur; if (t.cd <= 0) { t.cd = TOURELLE_CADENCE; tirer(t); } }
  }
  majOrbes(dt * (av.sombre ? 1.3 : 1));
  if (!j1.horsJeu) majLabo(dt);
  if (j1.horsJeu) return;
  const dtJ = dt;
  // ennemis
  for (const e of av.ennemis) {
    if (e.mort) continue;
    const dt = dtJ * av.dur;
    e.t += dt;
    if (e.type === "e") {
      const nx = e.x + e.dir * ENNEMI_VITESSE * dt, avant = nx + e.dir * 18;
      if (solideEn(avant, e.y) || !solideEn(avant, e.y + 30)) e.dir *= -1; else e.x = nx;
    } else if (e.type === "f") {
      e.y = e.y0 + Math.sin(e.t * 2.2) * 10;
    } else {
      const dx = j1.x - e.x, dy = j1.y - e.y, d = Math.hypot(dx, dy) || 1;
      if (d < ENNEMI_VUE) { e.x += (dx / d) * ENNEMI_CHASSE * dt; e.y += (dy / d) * ENNEMI_CHASSE * dt; }
      e.y += Math.sin(e.t * 3) * 0.3;
    }
    if (Math.abs(j1.x - e.x) < DEMI + 15 && Math.abs(j1.y - e.y) < DEMI + 15) {
      const parDessus = j1.vy > 120 && j1.py + DEMI <= e.y - 6;
      if (j1.etat === "dash" || j1.apresDash > 0 || parDessus) eclaterEnnemi(e, parDessus);
      else return mourir();
    }
  }
  // pics, chute
  for (const p of av.pics) {
    if (j1.x + DEMI - 4 > p.x && j1.x - DEMI + 4 < p.x + p.w && j1.y + DEMI > p.y && j1.y - DEMI < p.y + p.h) return mourir();
  }
  if (j1.y > av.haut * TUILE + 120) return mourir();
  // lave qui monte
  if (av.mode === "lave") {
    if (av.laveAttente > 0) av.laveAttente -= dt; else av.lave -= NIVEAUX[av.i].vitesse * (av.sombre ? 1.2 : 1) * dt;
    av.lave = Math.min(av.lave, av.cam.y + H + 140);        // elle ne reste jamais loin derrière
    if (j1.y + DEMI * 0.3 > av.lave) return mourir();
  }
  // mur de lumière qui avance
  if (av.mode === "poursuite") {
    if (av.murAttente > 0) av.murAttente -= dt; else av.mur += NIVEAUX[av.i].vitesse * (av.sombre ? 1.2 : 1) * dt;
    av.mur = Math.max(av.mur, av.cam.x - 140);
    if (j1.x - DEMI < av.mur) return mourir();
  }
  if (av.mode === "boss") { majBoss(dt * (av.sombre ? 1.25 : 1)); if (av.fini) return; }
  // points de passage
  for (const d of av.drapeaux) {
    if (av.sombre) break;                    // mode sombre : pas de point de passage
    if (!d.actif && Math.abs(j1.x - d.x) < 40 && Math.abs(j1.y - d.y) < 80) {
      d.actif = true; av.reprise = d;
      eclats(d.x, d.y - 30, 18, BLEU, 400, 0, -1, 1, 300, 5); Son.saut(1);
      texte("POINT DE PASSAGE", d.x, d.y - 110, BLEU, 34);
    }
  }
  // arrivée : il faut se poser sur les blocs d'arrivée
  if (j1.sol) {
    const ch = av.grille[Math.floor((j1.y + DEMI + 2) / TUILE)]?.[Math.floor(j1.x / TUILE)];
    if (ch === "=") finirNiveau();
  }
  cadrerCamera(1 - Math.exp(-9 * dt));
}

/* ---------- Montage de fin : tous les essais rejoués en même temps ---------- */
function majMontage(dt) {
  av.montT += dt * av.montVit;
  const k = Math.floor(av.montT * 30);
  for (const e of av.essais) {
    const n = e.p.length / 2;
    if (e.mort && !e.vu && n > 0 && k >= n) {
      e.vu = true;
      eclats(e.p[2 * n - 2], e.p[2 * n - 1], 14, BLEU, 500, 0, 0, Math.PI, 500, 5);
    }
  }
  const f = av.essais[av.essais.length - 1], n = f.p.length / 2;
  if (n > 0) { const i = Math.min(k, n - 1); cadrerCamera(1 - Math.exp(-6 * dt), f.p[2 * i], f.p[2 * i + 1], 0); }
  if (av.montT > av.montDur + 0.5) finMontage();
}
function finMontage() {
  if (ecran !== "montage") return;
  j1.horsJeu = false;
  afficherFin();
}

/* ---------- Dessin du monde de l'aventure ---------- */
function dessinerMondeAventure() {
  ctx.drawImage(decorFond, 0, 0, W, H);
  for (const m of motes) { ctx.fillStyle = `rgba(255,170,120,${m.a})`; ctx.fillRect(m.x, m.y, m.t, m.t); }
  const cam = av.cam;
  ctx.save();
  if (secousse > 0) ctx.translate(rand(-secousse, secousse), rand(-secousse, secousse));
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  const tx0 = Math.max(0, Math.floor(cam.x / TUILE) - 1), tx1 = Math.min(av.larg - 1, Math.ceil((cam.x + W) / TUILE) + 1);
  const ty0 = Math.max(0, Math.floor(cam.y / TUILE) - 1), ty1 = Math.min(av.haut - 1, Math.ceil((cam.y + H) / TUILE) + 1);
  const bords = [];
  const plein = (x, y) => estSolide(av.grille[y]?.[x]);
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const ch = av.grille[ty][tx];
      if (!estSolide(ch)) continue;
      const x = tx * TUILE, y = ty * TUILE, sx = ((tx * 53 + ty * 31) % 12) * TUILE;
      if (ch === "j") { dessinerTuileLabo(ch, x, y, plein, tx, ty); continue; }
      ctx.drawImage(decorPlateforme, sx * echelle, (ty % 2 ? 20 : 0) * echelle, TUILE * echelle, TUILE * echelle, x, y, TUILE, TUILE);
      if (!plein(tx, ty - 1)) bords.push([x, y, ch]);
      if (!plein(tx, ty + 1)) { ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(x, y + TUILE - 5, TUILE, 5); }
      if (ch === "=") {
        ctx.fillStyle = `rgba(63,182,255,${0.25 + Math.sin(tempsTotal * 4) * 0.1})`; ctx.fillRect(x, y, TUILE, TUILE);
      } else if (ch === "v") {        // mur collant : gelée violette qui coule
        ctx.fillStyle = "rgba(194,107,255,0.34)"; ctx.fillRect(x, y, TUILE, TUILE);
        ctx.fillStyle = "rgba(214,150,255,0.55)";
        for (const c of [0, 1]) if (!plein(tx + (c ? 1 : -1), ty)) {
          const goutte = 6 + ((tx * 7 + ty * 13) % 5) * 3 + Math.sin(tempsTotal * 2 + ty) * 3;
          ctx.fillRect(c ? x + TUILE - 5 : x, y, 5, TUILE); ctx.fillRect(c ? x + TUILE - 7 : x, y + goutte, 7, 6);
        }
      } else if (ch === "<" || ch === ">") { dessinerTuileLabo(ch, x, y, plein, tx, ty);
      } else if (ch === "i") {        // mur glacé : reflets bleus
        ctx.fillStyle = "rgba(159,232,255,0.3)"; ctx.fillRect(x, y, TUILE, TUILE);
        ctx.strokeStyle = "rgba(230,250,255,0.55)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x + 8, y + TUILE - 6); ctx.lineTo(x + TUILE - 8, y + 6); ctx.stroke();
        ctx.fillStyle = "rgba(230,250,255,0.7)";
        for (const c of [0, 1]) if (!plein(tx + (c ? 1 : -1), ty)) ctx.fillRect(c ? x + TUILE - 3 : x, y, 3, TUILE);
      }
    }
  }
  // bords supérieurs lumineux
  ctx.save();
  ctx.shadowBlur = 16; ctx.lineWidth = 3;
  for (const [ombre, trait, test] of [["#ff9a4a", "#ffd7aa", (c) => c === "#"], [BLEU, "#bfe8ff", (c) => c === "="], [VIOLET, "#e7c4ff", (c) => c === "v"], [GLACE, "#ffffff", (c) => c === "i"]]) {
    ctx.shadowColor = ombre; ctx.strokeStyle = trait;
    ctx.beginPath();
    for (const [x, y, c] of bords) if (test(c)) { ctx.moveTo(x, y + 1); ctx.lineTo(x + TUILE, y + 1); }
    ctx.stroke();
  }
  ctx.restore();
  // panneau d'arrivée
  const arrivee = []; av.grille.forEach((l, ty) => { const tx = l.indexOf("="); if (tx >= 0) arrivee.push([tx, ty, l.lastIndexOf("=")]); });
  for (const [a, ty, b] of arrivee) {
    const x = ((a + b + 1) / 2) * TUILE, y = ty * TUILE - 70 + Math.sin(tempsTotal * 3) * 4;
    ctx.save(); ctx.font = "900 22px system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.shadowColor = BLEU; ctx.shadowBlur = 14; ctx.fillStyle = "#fff"; ctx.fillText("ARRIVÉE", x, y);
    ctx.beginPath(); ctx.moveTo(x - 8, y + 12); ctx.lineTo(x, y + 22); ctx.lineTo(x + 8, y + 12); ctx.strokeStyle = BLEU; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }
  dessinerObjets();
  dessinerLabo();
  // pics
  dessinerPicsStylises();
  // points de passage
  for (const d of av.drapeaux) {
    const col = d.actif ? BLEU : "rgba(255,240,230,0.45)";
    ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3;
    if (d.actif) { ctx.shadowColor = BLEU; ctx.shadowBlur = 12; }
    const bas = d.y + DEMI;
    ctx.beginPath(); ctx.moveTo(d.x, bas); ctx.lineTo(d.x, bas - 64); ctx.stroke();
    ctx.fillRect(d.x, bas - 64, 22 + (d.actif ? Math.sin(tempsTotal * 6) * 3 : 0), 14);
    ctx.restore();
  }
  dessinerAncres();
  // ennemis
  for (const e of av.ennemis) if (!e.mort) dessinerEnnemi(e);
  if (av.boss) dessinerBoss(av.boss);
  dessinerOrbes();
  if (ecran === "montage") dessinerFantomes();
  dessinerCorde(j1); dessinerVisee(j1); dessinerCube(j1);
  // le cube doré suit le joueur une fois ramassé
  if (av.dorePris && !j1.horsJeu) cubeDore(j1.x - j1.dir * 34, j1.y - 46 + Math.sin(tempsTotal * 4) * 4, 1, 14);
  if (av.mode === "lave") dessinerLave();
  if (av.mode === "poursuite") dessinerMurLumiere();
  dessinerParticules();
  ctx.restore();
  if (av.mode === "sombre") dessinerNoir();
}

function cubeDore(x, y, alpha, s = 13) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(Math.sin(tempsTotal * 2) * 0.2);
  ctx.shadowColor = OR; ctx.shadowBlur = alpha < 1 ? 0 : 20;
  rectArrondi(ctx, -s, -s, 2 * s, 2 * s, 4);
  ctx.fillStyle = alpha < 1 ? "rgba(255,210,63,0.08)" : "#3a2a05"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = OR; ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = OR;
  ctx.fillRect(-6, -5, 3, 7); ctx.fillRect(3, -5, 3, 7);
  ctx.restore();
}

// Objets des niveaux : blocs qui s'effondrent, plateformes mobiles, tourelles, ressorts, cristaux, scies, cube doré
function dessinerObjets() {
  // rails (sous tout le reste)
  ctx.save(); ctx.strokeStyle = "rgba(255,220,200,0.22)"; ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
  for (const p of av.mobiles) { ctx.beginPath(); ctx.moveTo(p.x0 + p.w / 2, p.y0 + p.h / 2); ctx.lineTo(p.x0 + p.dx + p.w / 2, p.y0 + p.dy + p.h / 2); ctx.stroke(); }
  for (const s of av.scies) { ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x0 + s.dx, s.y0 + s.dy); ctx.stroke(); }
  ctx.restore();
  // blocs qui s'effondrent
  for (const p of av.friables) {
    if (p.off > 0) {
      ctx.save(); ctx.strokeStyle = "rgba(255,220,200,0.2)"; ctx.setLineDash([4, 6]); ctx.lineWidth = 2;
      ctx.strokeRect(p.x + 3, p.y + 3, TUILE - 6, TUILE - 6); ctx.restore(); continue;
    }
    const tr = p.t > 0 ? rand(-2.5, 2.5) : 0;
    ctx.save(); ctx.translate(tr, p.t > 0 ? (FRIABLE_DELAI - p.t) * 8 : 0);
    rectArrondi(ctx, p.x + 2, p.y + 2, TUILE - 4, TUILE - 4, 4);
    ctx.fillStyle = "#3b2219"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#c9a38a"; ctx.stroke();
    ctx.strokeStyle = "rgba(255,215,180,0.55)"; ctx.lineWidth = 1.5;   // fissures
    ctx.beginPath(); ctx.moveTo(p.x + 10, p.y + 4); ctx.lineTo(p.x + 18, p.y + 18); ctx.lineTo(p.x + 14, p.y + 30);
    ctx.moveTo(p.x + 18, p.y + 18); ctx.lineTo(p.x + 31, p.y + 23); ctx.stroke();
    ctx.shadowColor = "#ff9a4a"; ctx.shadowBlur = 10; ctx.strokeStyle = "#ffd7aa"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x + 3, p.y + 2); ctx.lineTo(p.x + TUILE - 3, p.y + 2); ctx.stroke();
    ctx.restore();
  }
  // plateformes mobiles
  for (const p of av.mobiles) {
    ctx.save();
    rectArrondi(ctx, p.x, p.y, p.w, p.h, 6);
    ctx.fillStyle = "#2a1c1a"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,220,200,0.5)"; ctx.stroke();
    ctx.fillStyle = "rgba(255,220,200,0.35)";
    for (let k = 10; k < p.w - 6; k += 20) ctx.fillRect(p.x + k, p.y + p.h / 2 - 2, 8, 4);
    ctx.shadowColor = "#ff9a4a"; ctx.shadowBlur = 14; ctx.strokeStyle = "#ffd7aa"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x + 4, p.y + 1); ctx.lineTo(p.x + p.w - 4, p.y + 1); ctx.stroke();
    ctx.restore();
  }
  // tourelles
  for (const t of av.tourelles) {
    if (t.mort) continue;
    const charge = clamp(1 - t.cd / 0.5, 0, 1);
    ctx.save(); ctx.translate(t.x, t.y);
    rectArrondi(ctx, -19, -19, 38, 38, 5);
    ctx.fillStyle = "#1a0a0d"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = ROUGE; ctx.shadowColor = ROUGE; ctx.shadowBlur = 10 + charge * 18; ctx.stroke();
    ctx.rotate(t.vise);
    ctx.fillStyle = "#3a1018"; ctx.fillRect(4, -6, 20, 12); ctx.strokeRect(4, -6, 20, 12);
    ctx.shadowBlur = 0; ctx.fillStyle = `rgba(255,61,110,${0.4 + charge * 0.6})`;
    ctx.beginPath(); ctx.arc(0, 0, 6 + charge * 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // ressorts
  for (const r of av.ressorts) {
    const h = 16 - r.comp * 9;
    ctx.save(); ctx.strokeStyle = VERT; ctx.shadowColor = VERT; ctx.shadowBlur = 12; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(r.x - 12, r.y);
    for (let k = 1; k <= 4; k++) ctx.lineTo(r.x + (k % 2 ? 10 : -10), r.y - (h - 4) * (k / 4));
    ctx.stroke();
    ctx.fillStyle = VERT; ctx.fillRect(r.x - 17, r.y - h - 4, 34, 5);
    ctx.restore();
  }
  // cristaux
  for (const k of av.cristaux) {
    const y = k.y + Math.sin(tempsTotal * 3 + k.x) * 4, s = 13;
    ctx.save(); ctx.translate(k.x, y); ctx.rotate(tempsTotal * 1.5);
    ctx.beginPath(); ctx.moveTo(0, -s - 4); ctx.lineTo(s, 0); ctx.lineTo(0, s + 4); ctx.lineTo(-s, 0); ctx.closePath();
    if (k.off > 0) { ctx.strokeStyle = "rgba(93,255,176,0.3)"; ctx.lineWidth = 2; ctx.stroke(); }
    else {
      ctx.shadowColor = VERT; ctx.shadowBlur = 22; ctx.fillStyle = "rgba(93,255,176,0.35)"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = VERT; ctx.stroke();
    }
    ctx.restore();
  }
  // scies
  for (const s of av.scies) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(tempsTotal * 14);
    ctx.shadowColor = ROUGE; ctx.shadowBlur = 14; ctx.fillStyle = "#e8dcd6";
    ctx.beginPath();
    for (let k = 0; k < 24; k++) { const a = (k / 24) * Math.PI * 2, r = k % 2 ? SCIE_RAYON : SCIE_RAYON - 6; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = "#2a1414"; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // cube doré
  if (av.dore && !av.dorePris) cubeDore(av.dore.x, av.dore.y + Math.sin(tempsTotal * 3) * 5, av.dejaDore ? 0.4 : 1);
}

function dessinerOrbes() {
  for (const o of av.orbes) {
    const c = o.renvoye ? "#ffffff" : ROUGE;
    ctx.save(); ctx.shadowColor = o.renvoye ? BLEU : ROUGE; ctx.shadowBlur = 18; ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(o.x, o.y, ORBE_RAYON, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = o.renvoye ? BLEU : "#ffd0dc"; ctx.beginPath(); ctx.arc(o.x, o.y, ORBE_RAYON * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function dessinerBoss(b) {
  if (b.hors > 0) return;
  ctx.save();
  const tremble = b.etat === "prepare" ? rand(-3, 3) : 0;
  ctx.translate(b.x + tremble, b.y + BOSS_DEMI);
  ctx.scale(1 / b.sq, b.sq); ctx.translate(0, -BOSS_DEMI);
  const blanc = b.flashT > 0, s = BOSS_DEMI;
  ctx.shadowColor = blanc ? "#fff" : ROUGE; ctx.shadowBlur = b.etat === "prepare" ? 40 : 24;
  rectArrondi(ctx, -s, -s, 2 * s, 2 * s, 10);
  ctx.fillStyle = blanc ? "#fff" : "#16070a"; ctx.fill();
  ctx.lineWidth = 7; ctx.strokeStyle = blanc ? "#fff" : ROUGE; ctx.stroke();
  if (!blanc) {
    ctx.shadowBlur = 10; ctx.fillStyle = ROUGE; ctx.strokeStyle = ROUGE; ctx.lineCap = "round";
    const r = b.dir * 10, hY = b.etat === "sonne" ? 6 : 20;
    ctx.fillRect(r - 20, -10 - hY / 2, 9, hY); ctx.fillRect(r + 11, -10 - hY / 2, 9, hY);
    ctx.lineWidth = 6; ctx.beginPath();                         // gros sourcils en colère
    ctx.moveTo(r - 26, -34); ctx.lineTo(r - 8, -24); ctx.moveTo(r + 26, -34); ctx.lineTo(r + 8, -24); ctx.stroke();
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(r - 12, 18); ctx.lineTo(r + 12, 18); ctx.stroke();
  }
  ctx.restore();
  if (b.etat === "prepare") {
    ctx.save(); ctx.font = "900 34px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = ROUGE;
    ctx.shadowColor = ROUGE; ctx.shadowBlur = 14; ctx.fillText("!", b.x, b.y - BOSS_DEMI - 18); ctx.restore();
  }
}

function dessinerFantomes() {
  const k = Math.floor(av.montT * 30);
  for (const e of av.essais) {
    const n = e.p.length / 2;
    if (n === 0 || (e.mort && k >= n)) continue;
    const i = Math.min(k, n - 1);
    if (e.final) corpsCube(j1, e.p[2 * i], e.p[2 * i + 1], 0, 1, true, 1);
    else corpsCube(j1, e.p[2 * i], e.p[2 * i + 1], 0, 1, false, 0.45);
  }
}

function dessinerLave() {
  const y0 = av.lave, x0 = av.cam.x - 20, x1 = av.cam.x + W + 20;
  ctx.save();
  const g = ctx.createLinearGradient(0, y0, 0, y0 + 300);
  g.addColorStop(0, "#ff7a2a"); g.addColorStop(0.15, "#e2361b"); g.addColorStop(1, "#5a0b06");
  ctx.fillStyle = g; ctx.shadowColor = "#ff6a2a"; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.moveTo(x0, y0 + H);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, y0 + Math.sin(x * 0.02 + tempsTotal * 3) * 6 + Math.sin(x * 0.007 - tempsTotal) * 5);
  ctx.lineTo(x1, y0 + H); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,220,120,0.7)";
  for (let k = 0; k < 14; k++) {
    const x = x0 + ((k * 97 + Math.floor(tempsTotal * 0.5) * 31) % (W + 40)), ph = (tempsTotal * 0.8 + k * 0.37) % 1;
    ctx.beginPath(); ctx.arc(x, y0 + 30 + (1 - ph) * 80, 3 + ph * 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function dessinerMurLumiere() {
  const x = av.mur, y0 = av.cam.y - 20;

  const pads = navigator.getGamepads ? [...navigator.getGamepads()] : [];

// --- Labo : nouveaux éléments à valider ---
const GLACE_ADHERENCE = 0.12;     // sol glacé : on accélère et on freine beaucoup moins
const TAPIS_VITESSE = 170;        // tapis roulants (px/s)
const GELEE_REBOND = 1510;        // bloc de gelée : rebond automatique (px/s)
const VENT_FORCE = 4300, VENT_MAX = 520, VENT_HAUTEUR = 11;   // ventilateurs
const PILON_CHUTE = 2800, PILON_REMONTE = 150, PILON_PAUSE = 0.8;
const PORTE_DUREE = 5;            // durée d'ouverture des portes après le bouton (s)
const ROSE = "#ff8adf";

// mise à jour des éléments du labo (appelée dans majAventure)
function majLabo(dt) {
  // tapis roulants
  if (j1.sol && j1.solP && (j1.solP.mat === "<" || j1.solP.mat === ">")) j1.x += (j1.solP.mat === ">" ? 1 : -1) * TAPIS_VITESSE * dt;
  // ventilateurs
  for (const v of av.vents) {
    v.t += dt;
    if (Math.abs(j1.x - v.x) < 30 && j1.y < v.y && j1.y > v.haut) {
      j1.vy = Math.max(j1.vy - VENT_FORCE * dt, -VENT_MAX);
      if (Math.random() < 0.2) eclats(j1.x + rand(-20, 20), j1.y + DEMI, 1, "#ffffff", 120, 0, -1, 0.3, -200, 3);
    }
  }
  // pilons : tombent quand on passe dessous
  for (const p of av.pilons) {
    const oy = p.y;
    if (p.etat === "haut") {
      p.t -= dt;
      if (p.t <= 0 && j1.x + DEMI > p.x - 12 && j1.x - DEMI < p.x + p.w + 12 && j1.y > p.y + p.h) { p.etat = "chute"; p.v = 0; }
    } else if (p.etat === "chute") {
      p.v += PILON_CHUTE * dt; p.y += p.v * dt;
      const bas = p.y + p.h;
      if (solideEn(p.x + 6, bas) || solideEn(p.x + p.w - 6, bas)) {
        p.y = Math.floor(bas / TUILE) * TUILE - p.h; p.etat = "pose"; p.t = PILON_PAUSE;
        trembler(9); poussiere(p.x + 6, p.y + p.h, 8); poussiere(p.x + p.w - 6, p.y + p.h, 8); Son.boum(0.5);
      }
      // écrasé !
      if (j1.x + DEMI - 4 > p.x && j1.x - DEMI + 4 < p.x + p.w && j1.y - DEMI < p.y + p.h && j1.y + DEMI > p.y + p.h - 30) return mourir();
    } else if (p.etat === "pose") { p.t -= dt; if (p.t <= 0) p.etat = "monte"; }
    else if (p.etat === "monte") { p.y = Math.max(p.y0, p.y - PILON_REMONTE * dt); if (p.y <= p.y0) { p.etat = "haut"; p.t = 0.4; } }
    if (j1.sol && j1.solP === p) j1.y += p.y - oy;
  }
  // bouton et portes
  if (av.portesT > 0) {
    av.portesT -= dt;
    if (av.portesT <= 0) {
      if (av.portes.some((d) => Math.abs(j1.x - (d.x + TUILE / 2)) < TUILE / 2 + DEMI && Math.abs(j1.y - (d.y + TUILE / 2)) < TUILE / 2 + DEMI)) av.portesT = 0.1;
      else { for (const d of av.portes) d.off = 0; Son.boum(0.3); }
    } else if (Math.ceil(av.portesT) !== Math.ceil(av.portesT + dt) && Son.pret()) Son.bip(av.portesT < 1.5);
  }
  for (const b of av.boutons) {
    const appuye = j1.sol && Math.abs(j1.x - b.x) < 24 + DEMI * 0.6 && Math.abs(j1.y + DEMI - b.y) < 6;
    if (appuye && !b.bas) {
      av.portesT = PORTE_DUREE; for (const d of av.portes) d.off = 1e9;
      Son.cling(); vibrer(30); texte("C'EST OUVERT !", b.x, b.y - 120, OR, 40);
    }
    b.bas = appuye;
  }
}

    ctx.strokeStyle = "rgba(255,220,200,0.35)"; ctx.lineWidth = 3;     // chaîne
    ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(p.x + p.w / 2, p.y0); ctx.lineTo(p.x + p.w / 2, p.y); ctx.stroke(); ctx.setLineDash([]);
    const tr = p.etat === "haut" && p.t <= 0 ? 0 : 0;
    rectArrondi(ctx, p.x + 2 + tr, p.y, p.w - 4, p.h, 6); ctx.fillStyle = "#1c1214"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = ROUGE; ctx.shadowColor = ROUGE; ctx.shadowBlur = p.etat === "chute" ? 24 : 10; ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = ROUGE;                       // dents du bas
    for (let x = p.x + 6; x < p.x + p.w - 6; x += 12) { ctx.beginPath(); ctx.moveTo(x, p.y + p.h); ctx.lineTo(x + 6, p.y + p.h + 8); ctx.lineTo(x + 12, p.y + p.h); ctx.fill(); }
    const r = (j1.x - (p.x + p.w / 2)) / 80;                         // yeux méchants
    ctx.fillRect(p.x + p.w / 2 - 14 + clamp(r, -1, 1) * 3, p.y + 14, 8, 5); ctx.fillRect(p.x + p.w / 2 + 6 + clamp(r, -1, 1) * 3, p.y + 14, 8, 5);
    ctx.restore();
  }
  // portes
  for (const d of av.portes) {
    if (d.off > 0) { ctx.save(); ctx.strokeStyle = "rgba(255,210,63,0.25)"; ctx.setLineDash([4, 6]); ctx.strokeRect(d.x + 8, d.y + 2, TUILE - 16, TUILE - 4); ctx.restore(); continue; }
    ctx.save();
    ctx.fillStyle = "#2a2010"; ctx.fillRect(d.x + 6, d.y, TUILE - 12, TUILE);
    ctx.strokeStyle = OR; ctx.lineWidth = 2; ctx.shadowColor = OR; ctx.shadowBlur = 10; ctx.strokeRect(d.x + 6, d.y + 1, TUILE - 12, TUILE - 2);
    ctx.beginPath(); ctx.moveTo(d.x + 6, d.y + 1); ctx.lineTo(d.x + TUILE - 6, d.y + TUILE - 1); ctx.stroke();
    ctx.restore();
  }
  // boutons
  for (const b of av.boutons) {
    ctx.save(); ctx.fillStyle = OR; ctx.shadowColor = OR; ctx.shadowBlur = b.bas || av.portesT > 0 ? 20 : 8;
    const h = b.bas ? 3 : 8;
    rectArrondi(ctx, b.x - 16, b.y - h, 32, h, 3); ctx.fill();
    ctx.fillStyle = "#3a3a3a"; ctx.shadowBlur = 0; ctx.fillRect(b.x - 22, b.y - 2, 44, 2);
    if (av.portesT > 0) { ctx.font = "900 20px ui-monospace, monospace"; ctx.textAlign = "center"; ctx.fillStyle = OR; ctx.fillText(Math.ceil(av.portesT), b.x, b.y - 26); }
    ctx.restore();

    ctx.shadowBlur = 0; ctx.font = "600 13px system-ui, sans-serif"; ctx.fillStyle = "rgba(255,240,230,0.75)"; ctx.fillText(pn.sous, pn.x, pn.y + 20);
    ctx.restore();

}
// dessus des tuiles nouvelles (glace au sol, tapis, gelée)
function dessinerTuileLabo(ch, x, y, plein, tx, ty) {
  if (ch === "<" || ch === ">") {
    ctx.fillStyle = "#1d1515"; ctx.fillRect(x, y, TUILE, 12);
    ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 2.5; const s = ch === ">" ? 1 : -1, dec = ((tempsTotal * TAPIS_VITESSE) % 20) * s;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, TUILE, 12); ctx.clip();
    ctx.beginPath();
    for (let k = -1; k < 3; k++) { const cx = x + k * 20 + dec; ctx.moveTo(cx - 4 * s, y + 2); ctx.lineTo(cx + 4 * s, y + 6); ctx.lineTo(cx - 4 * s, y + 10); }
    ctx.stroke(); ctx.restore();
  } else if (ch === "j") {
    ctx.save();
    const bulle = Math.sin(tempsTotal * 5 + tx) * 2;

    ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.beginPath(); ctx.arc(x + 11, y + 11 - bulle, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
