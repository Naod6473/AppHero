<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Les stats · Apphéro</title>
  <meta name="theme-color" content="#FFD83D">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/stats.js"></script>
  <style>
    .stats { max-width: 1180px; margin: 0 auto; padding: 16px 32px 72px; }
    .stats-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 18px 0 28px; }
    .stats-bar input { font: inherit; font-weight: 700; border: 3px solid var(--ink); border-radius: 12px; padding: 10px 12px; min-width: 0; flex: 1 1 220px; max-width: 320px; }
    .periods { display: flex; gap: 8px; flex-wrap: wrap; }
    .periods button[aria-pressed="true"] { background: var(--ink); color: var(--yellow); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .kpi { background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 5px 5px 0 var(--ink); padding: 14px 16px; }
    .kpi small { display: block; font-weight: 800; font-size: 13px; }
    .kpi strong { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1.1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px; }
    .box { background: var(--paper); border: 4px solid var(--ink); border-radius: 20px; box-shadow: 6px 6px 0 var(--ink); padding: 18px; min-width: 0; }
    .box h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0 0 4px; }
    .box > p { margin: 0 0 12px; font-size: 14px; }
    .bars { display: flex; flex-direction: column; gap: 6px; }
    .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; position: relative; padding: 4px 8px; border-radius: 8px; overflow: hidden; }
    .bar::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--c, var(--cyan)); opacity: 0.55; border-radius: 8px; }
    .bar span, .bar b { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cols { display: flex; align-items: flex-end; gap: 3px; height: 140px; }
    .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
    .col i { width: 100%; min-height: 2px; background: var(--orange); border: 2px solid var(--ink); border-radius: 4px 4px 0 0; }
    .col small { font-size: 11px; font-weight: 800; height: 14px; }
    .empty { font-size: 14px; opacity: 0.7; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 5px 6px; border-bottom: 2px solid #15112b22; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    @media (max-width: 640px) { .stats { padding: 12px 16px 56px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="wrap nav">
    <a class="logo" href="/">APPHÉRO</a>
    <a class="btn btn-pill" href="/">Retour à l'accueil</a>
  </header>
  <main class="stats">
    <h1 class="mega" style="font-size: clamp(48px, 8vw, 84px)">Les stats</h1>
    <p>Réservé à l'organisateur. Mesure maison, sans cookie.</p>
    <form class="stats-bar" id="login">
      <input id="token" type="password" autocomplete="current-password" placeholder="Code organisateur" aria-label="Code organisateur">
      <div class="periods" id="periods">
        <button class="btn btn-pill" type="button" data-days="1">Aujourd'hui</button>
        <button class="btn btn-pill" type="button" data-days="7">7 jours</button>
        <button class="btn btn-pill" type="button" data-days="30" aria-pressed="true">30 jours</button>
        <button class="btn btn-pill" type="button" data-days="400">Tout</button>
      </div>
      <button class="btn btn-dark" type="submit">Voir</button>
      <button class="btn" type="button" id="ts-test">Tester l'anti-robot du vote</button>
    </form>
    <div id="out"></div>
  </main>
</body>
</html>
