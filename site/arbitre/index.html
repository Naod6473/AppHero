<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>L'arbitre · Préavis · Apphéro</title>
  <meta name="theme-color" content="#FFD83D">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/arbitre.js"></script>
  <style>
    .arb { max-width: 1080px; margin: 0 auto; padding: 16px 32px 96px; }
    .arb-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 18px 0 24px; }
    .arb input, .arb select, .arb textarea { font: inherit; font-weight: 700; border: 3px solid var(--ink); border-radius: 12px; padding: 10px 12px; min-width: 0; width: 100%; background: #fff; }
    .arb textarea { resize: vertical; font-weight: 500; }
    .arb-bar input { flex: 1 1 220px; max-width: 320px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .kpi { background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 5px 5px 0 var(--ink); padding: 12px 16px; }
    .kpi small { display: block; font-weight: 800; font-size: 13px; }
    .kpi strong { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.1; }
    .arb-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .arb-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--yellow); }
    .box { background: var(--paper); border: 4px solid var(--ink); border-radius: 20px; box-shadow: 6px 6px 0 var(--ink); padding: 18px; min-width: 0; margin-bottom: 20px; }
    .box h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 6px 0 4px; }
    .box h3 { font-size: 17px; font-weight: 800; margin: 16px 0 8px; }
    .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; }
    .pill { border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; background: #fff; }
    .pill.open { background: var(--mint); }
    .pill.wait { background: var(--orange); }
    .pill.draft { background: var(--lilac); }
    .pill.done { background: var(--cyan); }
    .meta { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
    .rules { margin: 0 0 10px; font-size: 14.5px; }
    table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
    th, td { text-align: left; padding: 5px 6px; border-bottom: 2px solid #15112b22; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    tr.win td { background: #7cf2b066; font-weight: 800; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .actions .btn { font-size: 15px; padding: 8px 16px; border-width: 3px; box-shadow: 4px 4px 0 var(--ink); }
    .actions .btn-dark { box-shadow: 4px 4px 0 var(--pink); }
    .danger { background: var(--pink); }
    .form { display: grid; gap: 12px; }
    .form label, .form legend { font-weight: 800; font-size: 14px; display: grid; gap: 5px; }
    .form small, .hint { font-weight: 500; font-size: 13.5px; color: var(--muted); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    fieldset { border: 3px dashed var(--ink); border-radius: 14px; padding: 12px; margin: 0; display: grid; gap: 8px; }
    .orow { display: grid; grid-template-columns: minmax(0, 1fr) 84px 92px 70px auto; gap: 8px; align-items: center; }
    .orow .odd { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
    .orow button, .mini { font: inherit; font-weight: 800; font-size: 13px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; padding: 6px 10px; cursor: pointer; }
    .check { display: flex !important; grid-auto-flow: column; align-items: center; gap: 8px; }
    .check input { width: 22px; height: 22px; }
    .radios { display: grid; gap: 6px; }
    .radios label { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; border: 3px solid var(--ink); border-radius: 12px; padding: 8px 12px; background: #fff; cursor: pointer; }
    .radios input { width: 20px; height: 20px; }
    .resolve { margin-top: 16px; padding-top: 14px; border-top: 3px dashed var(--ink); }
    .confirm { margin-top: 14px; padding: 14px; border: 3px solid var(--ink); border-radius: 14px; background: var(--yellow); font-weight: 700; }
    .empty { font-size: 15px; opacity: 0.75; }
    .scroll { overflow-x: auto; }
    .scroll table { min-width: 620px; }
    @media (max-width: 640px) { .arb { padding: 12px 16px 72px; } .two { grid-template-columns: 1fr; } .orow { grid-template-columns: 1fr 70px 76px; } .orow .odd { text-align: left; } }
  </style>
</head>
<body>
  <header class="wrap nav">
    <a class="logo" href="/">APPHÉRO</a>
    <a class="btn btn-pill" href="/apps/11-preavis/jouer/">Voir la salle</a>
  </header>
  <main class="arb">
    <h1 class="mega" style="font-size: clamp(48px, 8vw, 84px)">L'arbitre</h1>
    <p>Réservé à l'organisateur de Préavis (app 11) : ouvrir des paris, les clore, les trancher avec une source.</p>
    <form class="arb-bar" id="login">
      <input id="token" type="password" autocomplete="current-password" placeholder="Code organisateur" aria-label="Code organisateur">
      <button class="btn btn-dark" type="submit">Ouvrir</button>
    </form>
    <div id="out"></div>
  </main>
</body>
</html>
