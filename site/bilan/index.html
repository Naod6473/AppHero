<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le bilan · Apphéro</title>
  <meta name="description" content="Le bilan d'Apphéro : 30 apps en 30 jours, le temps passé, les tokens, les apps les plus aimées et la grande gagnante.">
  <meta name="theme-color" content="#FFD83D">
  <meta property="og:title" content="Le bilan · Apphéro">
  <meta property="og:description" content="30 apps, une gagnante. Le bilan du défi.">
  <meta property="og:url" content="https://apphero.cloud/bilan/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script type="module" src="/src/bilan.js"></script>
  <script src="/t.js" defer></script>
  <style>
    .bilan { padding-bottom: 96px; }
    .champ { position: relative; margin: 32px 0 48px; background: var(--pink); border: 5px solid var(--ink); border-radius: 36px; box-shadow: 12px 12px 0 var(--ink); padding: 36px; text-align: center; transform: rotate(-1deg); }
    .champ small { font-weight: 800; font-size: 18px; letter-spacing: 1px; }
    .champ .crown { display: block; font-size: 72px; line-height: 1; margin: 8px 0; }
    .champ strong { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(48px, 9vw, 96px); line-height: 1; color: var(--yellow); -webkit-text-stroke: 3px var(--ink); }
    .champ a.btn { margin-top: 20px; }
    .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 48px; }
    .num { background: var(--paper); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); padding: 18px; }
    .num:nth-child(3n+1) { background: var(--mint); transform: rotate(-1deg); }
    .num:nth-child(3n+2) { background: var(--cyan); transform: rotate(0.8deg); }
    .bilan h1 { margin-bottom: 28px; }
    .num b { white-space: nowrap; margin-bottom: 8px; display: block; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 4.5vw, 50px); line-height: 1; }
    .num span { font-weight: 800; font-size: 16px; }
    .wait { text-align: center; margin: 48px auto; max-width: 620px; }
    .wait strong { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 8vw, 72px); line-height: 1.05; margin: 12px 0; }
  </style>
</head>
<body>
  <header class="wrap nav">
    <a class="logo" href="/">APPHÉRO</a>
    <a class="btn btn-pill" href="/">Retour à l'accueil</a>
  </header>
  <main class="wrap bilan">
    <h1 class="mega" style="font-size: clamp(64px, 11vw, 120px)">Le bilan</h1>
    <div id="out"><p class="lead">Chargement…</p></div>
  </main>
  <footer class="footer" data-footer></footer>
</body>
</html>
